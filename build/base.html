    <div class="tbl-wrap"><table><thead><tr><th style="width:150px">Date</th><th>Request</th><th>Why it is outside scope</th><th style="width:90px">Hours</th><th style="width:140px">Status</th><th style="width:60px"></th></tr></thead><tbody>
    ${S.changes.map((d,i)=>`<tr><td><input type="date" data-log="changes" data-i="${i}" data-k="date" value="${esc(d.date)}"></td><td><input type="text" data-log="changes" data-i="${i}" data-k="q" value="${esc(d.q)}"></td><td><input type="text" data-log="changes" data-i="${i}" data-k="r" value="${esc(d.r)}"></td><td><input type="number" min="0" data-log="changes" data-i="${i}" data-k="h" value="${esc(d.h)}"></td><td><select data-log="changes" data-i="${i}" data-k="c">${["Flagged","With PM","Priced","Declined"].map(o=>`<option ${d.c===o?"selected":""}>${o}</option>`).join("")}</select></td><td><button class="iconbtn" data-del="changes" data-i="${i}" aria-label="Remove">${ic("x","width:16px;height:16px")}</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Review the last three months and list every out-of-scope request.</td></tr>`}
    </tbody></table></div></div>`;
};

let cpSel = 1;
V.checkpoint = () => {
  const full=SC.filter(s=>scnState(s)==="full").length, marked=SC.filter(s=>(S.marks[s.id]||{}).ok).length;
  const s = cpSel==="bonus" ? null : SC.find(x=>x.id===+cpSel)||SC[0];
  const a = s ? (S.answers[s.id]||[]) : (S.answers.bonus||[]), m = s ? (S.marks[s.id]||{}) : {};
  return `
  <div class="ph"><div><div class="crumb">End of Week 6 · closes Phase 1</div><h1>Team workflow scenario test</h1><div class="sub">Ten situations · open book · say what you would do and which part of the workflow you are applying</div></div>
    <div class="acts"><a class="btn out" href="#/workflow">${ic("flow")}Open the workflow</a></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><span class="tile t-blue">${ic("check")}</span><div><div class="k">Answered</div><div class="s">Every question filled</div></div><div class="v">${full}/10</div></div>
    <div class="card kpi"><span class="tile t-amber">${ic("log")}</span><div><div class="k">Partly answered</div><div class="s">Some questions open</div></div><div class="v">${SC.filter(x=>scnState(x)==="part").length}</div></div>
    <div class="card kpi"><span class="tile t-green">${ic("award")}</span><div><div class="k">Marked complete</div><div class="s">By the mentor</div></div><div class="v">${marked}/10</div></div>
    <div class="card kpi"><span class="tile t-red">${ic("alert")}</span><div><div class="k">Format</div><div class="s">Open book · mentor-marked</div></div><div class="v" style="font-size:1.1rem">60–90m</div></div>
  </div>
  <div class="md">
    <div class="card slist" role="list">${SC.map(x=>{ const st=scnState(x); return `<button role="listitem" data-scn="${x.id}" aria-current="${String(x.id)===String(cpSel)}"><span class="n ${st}">${x.id}</span><span class="tt">${esc(x.title)}</span>${(S.marks[x.id]||{}).ok?ic("ok","color:var(--green);width:16px;height:16px"):""}</button>`; }).join("")}
      <button data-scn="bonus" aria-current="${cpSel==="bonus"}"><span class="n">★</span><span class="tt">Bonus · not scored</span></button></div>
    <div class="card">
      ${s?`<div class="card-h"><span class="avatar" style="background:var(--amber);color:#1A1205">${s.id}</span><h2>${esc(s.title)}</h2><div class="r"><span class="muted small">${answeredCount(s.id)}/${s.questions.length} answered</span></div></div>
      <div class="callout">${esc(s.situation)}</div>
      ${s.questions.map((q,k)=>`<label class="q-label" for="a${k}">${esc(q)}</label><textarea id="a${k}" data-ans="${s.id}" data-k="${k}" ${isMentor()?"readonly":""} placeholder="${isMentor()?"No answer yet":"Write in full sentences. Name who and by when."}">${esc(a[k]||"")}</textarea>`).join("")}
      ${isMentor()?`<div class="mark"><label style="display:flex;gap:8px;align-items:center;font-weight:600;flex:0 0 auto"><input type="checkbox" data-mark="${s.id}" ${m.ok?"checked":""}> Complete</label><textarea data-mnote="${s.id}" placeholder="Missing elements, wrong turns">${esc(m.note||"")}</textarea><div class="small muted" style="flex-basis:100%">Mark against the required elements in your mentor version. They are not stored in this page, so candidates cannot read them.</div></div>`:""}`
      :`<div class="card-h"><span class="avatar">★</span><h2>Bonus question</h2></div><div class="callout">What have you run into over the last month that this workflow does not cover? Propose one addition and say which phase it belongs to.</div><label class="q-label" for="bonus">Your proposal</label><textarea id="bonus" data-ans="bonus" data-k="0" ${isMentor()?"readonly":""}>${esc(a[0]||"")}</textarea>`}
      <div class="frow mt" style="justify-content:space-between"><button class="btn quiet" data-scn="${s?(s.id>1?s.id-1:1):10}" style="flex:0 0 auto" ${s&&s.id===1?"disabled":""}>Previous</button><button class="btn" data-scn="${s?(s.id<10?s.id+1:"bonus"):"bonus"}" style="flex:0 0 auto" ${!s?"disabled":""}>${s&&s.id===10?"Bonus question":"Next situation"}</button></div>
    </div>
  </div>`;
};

V.record = () => {
  const done=C.filter(c=>lvl(c.id)>=3).length;
  return `
  <div class="ph"><div><h1>Competency sign-off record</h1><div class="sub">Final sign-off needs all fifteen at Level 3, assessed by the mentor with the project PM</div></div></div>
  <div class="grid g4">${COURSE.levels.map((L,i)=>{ const n=C.filter(c=>lvl(c.id)===i+1).length; return `<div class="card kpi"><span class="tile ${["t-amber","t-blue","t-green","t-green"][i]}" style="font-weight:700">${L.code}</span><div><div class="k">${L.name}</div><div class="s">${esc(L.text.split(".")[0])}</div></div><div class="v">${n}</div></div>`; }).join("")}</div>
  <div class="card mt"><div class="card-h"><h2>Record</h2><div class="r"><div style="width:200px"><div class="pbar green"><i style="width:${done/15*100}%"></i></div><div class="muted small" style="margin-top:4px">${done}/15 at L3 or above</div></div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Competency</th><th>Week</th><th>Level</th><th style="width:130px">Progress</th><th>Mentor</th><th>Date</th></tr></thead><tbody>
    ${C.map(c=>{ const s=S.sign[c.id]||{}, l=lvl(c.id); return `<tr><td><span class="avatar sm" style="width:30px;height:30px">${c.id}</span></td><td><a href="#/c/${c.id}" style="font-weight:600">${esc(c.title)}</a></td><td class="muted">${esc(c.weekLabel.replace(/Weeks? /,""))}</td>
      <td>${isMentor()?`<select data-rec="${c.id}" aria-label="Level for ${c.id}" style="width:auto"><option value="">—</option>${[1,2,3,4].map(k=>`<option value="${k}" ${l===k?"selected":""}>L${k}</option>`).join("")}</select>`:(l?`<span class="chip ${l>=3?"done":"progress"}">L${l}</span>`:`<span class="muted">—</span>`)}</td>
      <td><div class="lvlbar ${l>=3?"done":""}">${[1,2,3,4].map(k=>`<i class="${k<=l?"on":""}"></i>`).join("")}</div></td><td class="muted">${esc(s.mentor||"—")}</td><td class="muted">${esc(s.date||"—")}</td></tr>`; }).join("")}
    </tbody></table></div></div>
  <div class="card mt"><div class="card-h"><h2>Final assessment · end of Week 10</h2><div class="r"><span class="muted small">Three pieces of live evidence, not a review of paperwork</span></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${COURSE.final.map((f,i)=>`<label class="card" style="background:var(--panel-2);display:flex;gap:12px;cursor:${isMentor()?"pointer":"default"};${S.final[i]?"border-color:var(--green)":""}"><input type="checkbox" data-final="${i}" ${S.final[i]?"checked":""} ${isMentor()?"":"disabled"} style="margin-top:4px;accent-color:var(--green)"><div><b>${i+1}. ${esc(f.t)}</b><div class="muted small" style="margin-top:4px">${esc(f.d)}</div></div></label>`).join("")}</div></div>`;
};

V.engine = () => {
  const c=C[6], sampleJ=JSON.stringify({id:c.id,title:c.title,weekLabel:c.weekLabel,phase:c.phase,uses:c.uses,purpose:c.purpose,good:c.good.slice(0,2).concat(["…"]),fail:["…"],task:"…",signoff:"…"},null,2);
  return `
  <div class="ph"><div><h1>How it's built</h1><div class="sub">Every screen renders from one course data object. A second course is a new data file, not new code.</div></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><span class="tile t-blue" style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center">${ic("book","width:16px;height:16px")}</span><h2>What the course team supplies</h2></div><ul class="lst">${["Program document: phases, weeks, competencies","Reference documents: workflow, standards form","Checkpoint scenarios, candidate version","Escalation and routing rules"].map(x=>`<li><span class="mk t-blue">${ic("ok")}</span>${x}</li>`).join("")}</ul></div>
    <div class="card"><div class="card-h"><span class="tile t-green" style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center">${ic("cpu","width:16px;height:16px")}</span><h2>What the engine generates</h2></div><ul class="lst">${["Overview, timeline and progress charts","Competency pages with quick checks","Practice drills from rule tables","Working tools: standards form and logs","Mentor sign-off and record"].map(x=>`<li><span class="mk t-green">${ic("ok")}</span>${x}</li>`).join("")}</ul></div>
  </div>
  <div class="card mt"><div class="card-h"><h2>One competency, as data</h2></div><pre>${esc(sampleJ)}</pre></div>
  <div class="card mt"><div class="card-h"><h2>Demo limits</h2></div><ul class="lst">${["Progress lives in this browser only; the full build needs sign-in and shared storage so a mentor sees the candidate's work.","The mentor marking key is intentionally absent from the page.","Video slots are placeholders on each competency's Overview tab."].map(x=>`<li><span class="mk t-amber">${ic("alert")}</span>${x}</li>`).join("")}</ul></div>`;
};

/* ============================================================ ROUTER & EVENTS ============================================================ */
function parse(){ const h=(location.hash||"#/").slice(1); const [p,q]=h.split("?"); const parts=p.split("/").filter(Boolean); const qs={}; (q||"").split("&").forEach(kv=>{ if(kv){ const [k,v]=kv.split("="); qs[k]=decodeURIComponent(v||""); } }); return {view:parts[0]||"home",arg:parts[1],qs}; }
function focusSel(el){ if(!el||!el.dataset) return null; const d=el.dataset;
  if (d.f) return `[data-f="${d.f}"][data-k="${d.k}"]`; if (d.log) return `[data-log="${d.log}"][data-i="${d.i}"][data-k="${d.k}"]`;
  if (d.gap) return `[data-gap="${d.gap}"]`; if (el.id) return "#"+el.id; return null; }
function render(keep){
  const fs=focusSel(document.activeElement), y=window.scrollY, {view,arg,qs}=parse();
  $("#page").innerHTML = backBar() + (view==="c" ? V.comp(arg) : (V[view]||V.home)(arg,qs));
  $("#page").classList.toggle("has-back", BACK.length>0);
  renderChrome(); if(keep){ window.scrollTo(0,y); if(fs){ const n=$(fs); if(n){ n.focus({preventScroll:true}); } } }
}
let lastView=parse().view, lastArg=parse().arg, lastHash=location.hash||"#/";
/* back stack: each in-content link (a competency's document button, an Overview card, a map box, a search result, a
   jump inside a document...) remembers where you were, so a "Back to ..." pill returns you to the same tab, section and
   scroll position. The sidebar, top bar and breadcrumbs are plain navigation and clear it; the competency pager and
   the table of contents move sideways and leave it alone. The browser Back button restores the same way. */
let BACK=[], NAV_SRC={k:null,t:0}, restoring=false;
const TAB_NAMES={overview:"Overview",task:"Practice task",check:"Quick check",sign:"Evidence & sign-off"};
function navKind(el){ if(!el||!el.closest) return null;
  if (el.closest("[data-back]")) return "back";
  if (el.closest(".side,.top,.crumb")) return "top";
  if (el.closest("[data-lateral],[data-next],#toc,.flow,.dots,.tabs")) return "lateral";
  return "content"; }
const navKindNow = () => performance.now()-NAV_SRC.t<1000 ? NAV_SRC.k : null;
["click","keydown"].forEach(ev=>document.addEventListener(ev,e=>{ if(ev==="keydown"&&e.key!=="Enter"&&e.key!==" ") return; NAV_SRC={k:navKind(e.target),t:performance.now(),el:e.target}; },true));
function retLabel(v,a){ if(v==="c"){ const c=C.find(x=>String(x.id)===String(a)); return c?`${c.id}. ${c.title}`:"competency"; }
  if(v==="doc") return (DOC_META[a]||{}).name||"document";
  const n=NAV.find(x=>x.h===(v==="home"?"#/":"#/"+v)); return n?n.t:"previous page"; }
function retSub(v,a){ if(v==="c") return TAB_NAMES[compTab]||"";
  if(v==="doc"&&DOCS[a]){ const own=NAV_SRC.el&&NAV_SRC.el.closest&&NAV_SRC.el.closest(".dsec"); let id=own&&own.isConnected?own.id.slice(4):null; if(!id) $$(".dsec").forEach(s=>{ if(s.getBoundingClientRect().top<160) id=s.id.slice(4); }); const s=DOCS[a].sections.find(x=>x.id===id); return s?s.title:""; }
  return ""; }
function snapshot(h,view,arg){ return {h,view,arg,tab:compTab,y:window.scrollY,label:retLabel(view,arg),sub:retSub(view,arg)}; }
function pushBack(e){ const t=BACK[BACK.length-1]; if(t&&t.h===e.h&&Math.abs(t.y-e.y)<40) return; BACK.push(e); if(BACK.length>20) BACK.shift(); }
const backBar = () => { const e=BACK[BACK.length-1]; return e?`<button class="retbar" data-back aria-label="Back to ${esc(e.label)}${e.sub?", "+esc(e.sub):""}"><span class="rb-ic">${ic("chev","width:16px;height:16px")}</span><span class="rb-t"><small>Back to</small>${esc(e.label)}</span>${e.sub?`<span class="chip">${esc(e.sub)}</span>`:""}</button>`:""; };
function goBack(){ const e=BACK[BACK.length-1]; if(!e) return; const {view,arg}=parse();
  if (e.view===view && e.arg===arg){ BACK.pop(); if(view==="c") compTab=e.tab; render(true); window.scrollTo({top:e.y,behavior:RM?"auto":"smooth"}); return; }
  if ((location.hash||"#/")===e.h) return; location.hash=e.h; }
window.addEventListener("hashchange",()=>{ const {view,arg}=parse(); const h=location.hash||"#/", kind=navKindNow(); NAV_SRC.k=null;
  const changed = view!==lastView||arg!==lastArg, top=BACK[BACK.length-1]; let back=null;
  if (kind==="top") BACK=[];
  else if (top && top.h===h) back=BACK.pop();
  else if (changed && kind==="content") pushBack(snapshot(lastHash,lastView,lastArg));
  lastHash=h; if(view==="c" && changed) compTab=back&&back.view==="c"?back.tab:"overview"; const same=!changed; lastView=view; lastArg=arg;
  restoring=!!back; render(same); restoring=false; if(!same){ window.scrollTo(0,back?back.y:0); $("#main").focus({preventScroll:true}); } closeSide(); });

const tip=$("#tip");
document.addEventListener("mouseover",e=>{ const t=e.target.closest&&e.target.closest("[data-tip]"); if(!t){ tip.hidden=true; return; } tip.innerHTML=t.dataset.tip; tip.hidden=false; });
document.addEventListener("mousemove",e=>{ if(tip.hidden) return; const w=tip.offsetWidth; tip.style.left=Math.min(window.innerWidth-w-10,e.clientX+14)+"px"; tip.style.top=(e.clientY+16)+"px"; });

document.addEventListener("click",e=>{
  const t=e.target, cl=s=>t.closest(s);
  const menu=$("#meMenu");
  if (cl("#meBtn")){ const o=menu.hidden; renderMenu(); menu.hidden=!o; $("#meBtn").setAttribute("aria-expanded",String(o)); return; }
  if (!cl("#meMenu")) { menu.hidden=true; $("#meBtn").setAttribute("aria-expanded","false"); }
  const rb=cl("[data-role]"); if (rb){ S.role=rb.dataset.role; save(); menu.hidden=true; render(true); toast(`Viewing as ${S.role}`); return; }
  const act=cl("[data-act]"); if (act){ menu.hidden=true;
    if (act.dataset.act==="sample"){ const th=S.ui.theme, role=S.role; S=sample(); S.ui.theme=th; S.role=role; save(); render(true); toast("Sample progress loaded"); }
    else if (confirm("Clear all demo progress in this browser?")){ const th=S.ui.theme; S=blank(); S.ui.theme=th; S.seeded=true; save(); render(true); toast("Started empty"); }
    return; }
  if (cl("#themeBtn")){ S.ui.theme=S.ui.theme==="dark"?"light":"dark"; save(); render(true); return; }
  if (cl("#bellBtn")){ location.hash="#/"; setTimeout(()=>{ const c=[...$$(".card-h h2")].find(h=>h.textContent==="Needs attention"); c&&c.scrollIntoView({behavior:"smooth",block:"center"}); },50); return; }
  if (cl("#collapseBtn")){ S.ui.collapsed=!S.ui.collapsed; save(); renderChrome(); return; }
  if (cl("#menuBtn")){ const s=$("#side"), o=!s.classList.contains("open"); s.classList.toggle("open",o); $("#menuBtn").setAttribute("aria-expanded",String(o)); return; }
  if (t.closest(".side a")) closeSide();
  if (cl("[data-back]")){ goBack(); return; }
  const go=cl("[data-go]"); if (go){ location.hash=go.dataset.go; return; }
  const tb=cl("[data-tab]"); if (tb){ compTab=tb.dataset.tab; render(true); return; }
  const sl=cl("[data-setlvl]"); if (sl){ const id=parse().arg, n=+sl.dataset.setlvl, s=S.sign[id]||{}; S.sign[id]={...s,level:lvl(id)===n?n-1||"":n,mentor:s.mentor||S.profile.mentor||"",date:s.date||today()}; save(); render(true); toast(S.sign[id].level?`Level set to L${S.sign[id].level}`:"Level cleared"); return; }
  if (t.id==="evSave"){ const id=parse().arg; S.evidence[id]=$("#ev").value.trim(); save(); render(true); toast("Evidence link saved"); return; }
  if (t.id==="signSave"){ const id=parse().arg, s=S.sign[id]||{}; S.sign[id]={...s,mentor:$("#mname").value.trim(),date:$("#mdate").value,note:$("#mnote").value.trim()}; save(); render(true); toast("Sign-off saved"); return; }
  const tg=cl(".toggle button"); if (tg){ $$("button",tg.parentNode).forEach(b=>b.setAttribute("aria-pressed",String(b===tg))); return; }
  if (cl("[data-qc-check]")){ const qc=cl(".qc"), items=$$(".qc-item",qc), msg=$("[data-qc-msg]",qc);
    if (items.some(it=>!$(".toggle button[aria-pressed='true']",it))){ msg.textContent="Sort every statement first."; return; }
    let right=0; items.forEach(it=>{ const ok=$(".toggle button[aria-pressed='true']",it).dataset.v===it.dataset.k; if(ok) right++; it.classList.toggle("right",ok); it.classList.toggle("wrong",!ok); const w=$(".why",it); w.hidden=false; w.textContent=it.dataset.k==="g"?"From “What good looks like”.":"From “Common failures”."; });
    S.qc[qc.dataset.id]=right; save(); renderChrome(); msg.textContent=`Score: ${right}/${items.length}`; toast(`Quick check: ${right}/${items.length}`); return; }
  const fp=cl("[data-filter]"); if (fp){ mapFilter=fp.dataset.filter; render(true); return; }
  const ph=cl("[data-ph]"); if (ph){ wfPhase=+ph.dataset.ph; render(true); return; }
  const rt=cl("[data-route]"); if (rt){ const i=S.drill.i||0; S.drill.r=S.drill.r||{}; S.drill.r[i]=+rt.dataset.route; save(); render(true); return; }
  if (t.closest("#drillNext")){ S.drill.i=(S.drill.i||0)+1; save(); render(true); return; }
  if (t.closest("#drillAgain")){ S.drill={}; save(); render(true); return; }
  const ac=cl("[data-acc]"); if (ac){ const k=ac.dataset.acc; formOpen[k]=!formOpen[k]; ac.parentNode.classList.toggle("open",!!formOpen[k]); ac.setAttribute("aria-expanded",String(!!formOpen[k])); return; }
  if (t.closest("#expandAll")){ COURSE.form.forEach((_,i)=>formOpen[i]=true); render(true); return; }
  if (t.closest("#collapseAll")){ formOpen={}; render(true); return; }
  const gb=cl("[data-gap]"); if (gb){ const v=S.form[gb.dataset.gap] ||= {}; v.gap=!v.gap; save(); render(true); return; }
  if (t.closest("#copyGaps")){ const txt=gapsList().map((g,i)=>`${i+1}. ${g.sec} — ${g.q}`).join("\n"); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied to clipboard")).catch(()=>toast("Copy is blocked here — select the list instead")); return; }
  const sc=cl("[data-scn]"); if (sc){ cpSel=sc.dataset.scn==="bonus"?"bonus":+sc.dataset.scn; render(true); if(window.innerWidth<1100) $(".md > .card:last-child").scrollIntoView({block:"start"}); return; }
  const add=cl("[data-add]"); if (add){ S[add.dataset.add].push({date:today(),q:"",c:add.dataset.add==="decisions"?"Decide":"Flagged",r:"",h:""}); save(); render(true); const ins=$$(`[data-log="${add.dataset.add}"][data-k="q"]`); ins.length&&ins[ins.length-1].focus(); return; }
  const del=cl("[data-del]"); if (del){ S[del.dataset.del].splice(+del.dataset.i,1); save(); render(true); toast("Entry removed"); return; }
});
document.addEventListener("keydown",e=>{
  const go=e.target.closest&&e.target.closest("[data-go]");
  if (go && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); location.hash=go.dataset.go; }
  if (e.key==="Escape"){ $("#meMenu").hidden=true; closeSide(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if (t.dataset.f){ (S.form[t.dataset.f] ||= {})[t.dataset.k]=t.value; save(); render(true); return; }
  if (t.dataset.log){ S[t.dataset.log][+t.dataset.i][t.dataset.k]=t.value; save(); if(t.dataset.k==="h"||t.dataset.k==="c") render(true); return; }
  if (t.dataset.rec){ const s=S.sign[t.dataset.rec]||{}; S.sign[t.dataset.rec]={...s,level:t.value?+t.value:"",mentor:s.mentor||S.profile.mentor||"",date:s.date||(t.value?today():"")}; save(); render(true); toast("Level updated"); return; }
  if (t.dataset.mark){ (S.marks[t.dataset.mark] ||= {}).ok=t.checked; save(); render(true); return; }
  if (t.dataset.final){ S.final[t.dataset.final]=t.checked; save(); render(true); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if (t.id==="mapSearch"){ mapQuery=t.value; const pos=t.selectionStart; render(true); const n=$("#mapSearch"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} return; }
  if (t.dataset.ans){ (S.answers[t.dataset.ans] ||= [])[+t.dataset.k]=t.value; save();
    const s=SC.find(x=>String(x.id)===t.dataset.ans); if (s){ const n=$(`[data-scn="${s.id}"] .n`); if(n) n.className="n "+scnState(s); } return; }
  if (t.dataset.mnote){ (S.marks[t.dataset.mnote] ||= {}).note=t.value; save(); return; }
});
function closeSide(){ const s=$("#side"); if(s.classList.contains("open")){ s.classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); } }

save(); render(false);
</script>

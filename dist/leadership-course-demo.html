const DOCS = {"program": {"key": "program", "title": "TEAM LEADER RAISING PROGRAM", "subtitle": ["Eracore Electrical BIM", "2 Phases", "15 Competencies", "10 Weeks"], "sections": [{"id": "s0", "title": "About the program", "blocks": [{"t": "fields", "items": [{"id": "program-1", "label": "Candidate Name"}, {"id": "program-2", "label": "Start Date"}, {"id": "program-3", "label": "Mentor Name"}, {"id": "program-4", "label": "Target Sign-Off Date"}, {"id": "program-5", "label": "Current Project"}, {"id": "program-6", "label": "Role Today"}]}, {"t": "p", "segs": [["Who this program is for. ", true, false], ["It takes a strong electrical BIM engineer and builds the judgment of a team leader. Skill in Revit, Navisworks and Bluebeam is assumed — you already have it. What is assessed here is what you do when the client adds an area on a Thursday, when your team is heading into a weekend to hit a pour date, and when a package is one click away from being released with an error in it.", false, false]]}, {"t": "p", "segs": [["How it is ordered. ", true, false], ["The program moves from what you already control to what you do not. Phase 1 is internal: the standards, the check list, constructability, then running the team's work. Nothing in it is visible to the client, so mistakes are cheap. Phase 2 puts you in front of the client and in charge of people, and it comes last because it depends on everything before it.", false, false]]}, {"t": "p", "segs": [["How it is assessed. ", true, false], ["Fifteen competencies, each with a practical task carried out on a live project. Your mentor observes, gives feedback, and signs off a level. There is no exam except the scenario test that closes Phase 1 — the rest of the evidence is the work itself.", false, false]]}, {"t": "p", "segs": [["Where your evidence goes. ", true, false], ["Every task output — the standards form, the check list, task breakdowns, decision logs, post-mortems, maps, meeting minutes — is saved to your personal folder in SharePoint under the matching week. Your mentor reviews it there before each sign-off.", false, false]]}, {"t": "callout", "blocks": [{"t": "p", "segs": [["Assessed on behavior, not attendance.  ", true, false], ["A competency is signed off when your mentor has seen you do it on a real project — not when you have read about it, and not when you sat in the room while someone else did it.", false, false]]}]}], "kicker": "", "meta": [], "group": ""}, {"id": "s1", "blocks": [{"t": "table", "id": "program-7", "head": ["Document", "What it is", "Used in"], "checkcols": [], "rows": [[{"k": "text", "segs": [["Team Communication Workflow", true, false]], "blocks": null, "text": "Team Communication Workflow"}, {"k": "text", "segs": [["The daily operating rhythm: how the day is prepared, how the team syncs, how questions travel, how work leaves the team.", false, false]], "blocks": null, "text": "The daily operating rhythm: how the day is prepared, how the team syncs, how questions travel, how work leaves the team."}, {"k": "text", "segs": [["Read in Week 1. Tested at the Phase 1 checkpoint.", false, false]], "blocks": null, "text": "Read in Week 1. Tested at the Phase 1 checkpoint."}], [{"k": "text", "segs": [["Project Technical Standards & Preferences Form", true, false]], "blocks": null, "text": "Project Technical Standards & Preferences Form"}, {"k": "text", "segs": [["The client's technical requirements for the project — routing, fill, spacing, bends, below-grade materials, access.", false, false]], "blocks": null, "text": "The client's technical requirements for the project — routing, fill, spacing, bends, below-grade materials, access."}, {"k": "text", "segs": [["Filled in for your own project in Week 1. Feeds the check list in Week 2.", false, false]], "blocks": null, "text": "Filled in for your own project in Week 1. Feeds the check list in Week 2."}]]}], "group": "", "title": "Documents You Will Need", "kicker": "", "meta": []}, {"id": "s2", "blocks": [{"t": "image", "which": "program-diagram"}], "group": "", "title": "How the Program Is Built", "kicker": "", "meta": []}, {"id": "s3", "blocks": [{"t": "levels", "items": [["L1", "Observes", "watches a senior lead do it, and can explain afterwards what happened and why"], ["L2", "Does with review", "does it themselves; the mentor checks before anything leaves the team"], ["L3", "Does independently", "does it unsupervised — the target level for final sign-off"], ["L4", "Teaches others", "coaches another engineer through it; expected within six months of sign-off"]]}], "group": "", "title": "Proficiency Levels", "kicker": "", "meta": []}, {"id": "s4", "blocks": [{"t": "p", "segs": [["Three things start early and are assessed at the end of Phase 1. They are habits, not tasks — none of them can be completed in a week.", false, false]]}, {"t": "bullets", "items": [[["Nothing leaves your team without a signed check list — from the day the check list exists", false, false]], [["Keep a written decision log: every question that comes up, classified decide or ask, and the reasoning", false, false]], [["Sit in on every client meeting as a listener from Week 1 — no speaking part until Phase 2", false, false]]]}], "group": "", "title": "Running in the Background", "kicker": "", "meta": []}, {"id": "s5", "blocks": [{"t": "p", "segs": [["Before anything else, know what this specific client requires. Most of what you will check later is defined here, and most of what you will argue about later is defined here too.", false, false]]}, {"t": "sub", "num": 1, "title": "Knows the Project's Technical Standards and Where They Live"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Every project carries a set of client-specific technical requirements — routing rules, fill, spacing, bend limits, sweep radii, below-grade materials, access and clearance. A lead who does not know them cannot check work against them, cannot brief the team on them, and cannot tell when the client is asking for something that contradicts them.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Project Technical Standards & Preferences Form", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Can state the project's requirements from memory for the systems the team is currently working on", false, false]], [["Knows where each one is written — specification, BEP, contract drawings, an RFI answer — and can produce the source", false, false]], [["Knows which requirements differ from what Eracore does by default, and has told the team", false, false]], [["Treats an unanswered requirement as an RFI, not as a place to improvise", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Working to habit or to the last project's rules because nobody checked this one's", false, false]], [["Discovering a requirement only when the client returns the package with comments", false, false]], [["Knowing a rule personally but never passing it to the team", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Fill in the Project Technical Standards & Preferences Form for your current project, using the contract documents, the specification, the BEP and the drawings. Cite the source for every answer. Mark every item you could not find an answer for — that list is the set of open questions you take to your PM. Then mark which answers your current model actually complies with.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["The completed form is reviewed by your mentor and the PM. Every answer traceable to a source, every gap listed rather than guessed at, and any non-compliance you found reported rather than quietly fixed.", true, false]]}]}]}, {"t": "sub", "num": null, "kicker": "Also this week", "title": "Read the Team Communication Workflow"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["The document that describes how a lead actually runs a day at Eracore. You will be tested on it at the end of Phase 1, and from this week you are watching your own lead run the cycle described in it.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Read it once this week. From Week 1 onward, observe how the eight phases play out on your project — where they are followed, where they are not, and what happens as a result. Keep notes; they will be useful at the checkpoint and in the bonus question.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["No formal sign-off. Assessed at the Phase 1 checkpoint.", true, false]]}]}]}], "group": "", "title": "The Standards You Work To", "kicker": "WEEK 1", "meta": ["Phase 1", "Competency 1"]}, {"id": "s6", "blocks": [{"t": "p", "segs": [["Two things that anchor everything later: where your package sits in the wider project, and the written instrument that decides whether work is finished.", false, false]]}, {"t": "sub", "num": 2, "title": "Understands the Project Lifecycle"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Your model is one step in a chain that ends with installed conduit and an energized building. A lead who cannot see the chain optimises the wrong thing and cannot explain to the team why a date matters.", false, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Understand the project phases, it’s sequence and what Eracore owes at each to the client. — understand the client requirements and whishes, BIM execution plan, sign-off and deadlines dates, installation and shop drawings sequence. Understand and follow the project required model LOD.", false, false]], [["Produces the detail appropriate to the phase, and does not detail hangers in an area still being coordinated", false, false]], [["Knows who consumes each deliverable next — the GC's VDC lead, the foreman laying out from the points, the shop building the spools — and what breaks for them when it is late or wrong", false, false]], [["Knows which decisions are still cheap and which are effectively permanent: once concrete is poured or gear is ordered, a modeling error becomes a field cost", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Detailing at shop-drawing level while the area is still in early coordination and the layout will change", false, false]], [["Not knowing the foreman is waiting on layout points, so a two-day slip in the export stops a crew", false, false]], [["Treating area sign-off as an administrative step rather than the moment risk transfers", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Collect the phases, dates and deliverables of your current project, or of another project your mentor assigns. Work from the documents you have, and go to your PM where the picture is incomplete or you can see gaps in it. Then build a Gantt table of the drawing deliverables in Excel, showing how the issues follow one another through the project. Where there is little firm information far out, cover at least the next two weeks properly.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["The dates are correct and the table is properly built — it is possible to see from it how the deliverables move through the project.", true, false]]}]}]}, {"t": "sub", "num": 3, "title": "Builds the Check List for the Package"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["The check list is the instrument that turns a standard into a verification. It is derived from the client's requirements, not invented — which is why it comes after the standards form and not before.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Project Technical Standards & Preferences Form", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Derived from the project standards form and the Eracore modeling standards, not from personal habit", false, false]], [["Grouped by layer — model, coordination, electrical requirements, supports, field data, sheets, package, history", false, false]], [["Short enough to be used on every release and specific enough that two different people checking the same package reach the same result", false, false]], [["Names who checks, and states that the checker is not the author", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Unclear wide not specific items to check", false, false]], [["Checks the model but never the issued PDF, the sheets, the revision table or the file naming", false, false]], [["Previous round's client comments were closed but were not included/updated in checklist", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Build the check list for your package type: one page, grouped by layer. Every item has to come from a real requirement — the completed standards form, the project specification, client requirements that have already been stated and recorded, and the Eracore internal standards. Note the source next to each item.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Every item is correctly written out, traceable to one of those four sources, and relevant to this project. A second person checking the same package by this list reaches the same result.", true, false]]}]}]}], "group": "", "title": "The Project and the Check List", "kicker": "WEEK 2", "meta": ["Phase 1", "Competencies 2 and 3"]}, {"id": "s7", "blocks": [{"t": "p", "segs": [["A check list is worth what it catches. This week tests it against real defects, and turns it from a document into a habit.", false, false]]}, {"t": "sub", "num": 4, "title": "Checks a Deliverable Properly"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Checking is a layered procedure, not a look over the model. Each layer catches a class of error the others cannot, and knowing which errors are critical matters as much as finding them.", false, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Model — correct levels and worksets, elements hosted properly, no orphaned or duplicated conduit, sizes and types matching the redlines", false, false]], [["Coordination — current federated model, clash test rerun at the agreed tolerance, resolved clashes verified as actually resolved rather than hidden or filtered out", false, false]], [["Electrical — routing, fill, spacing, bend radius and cumulative bend limits, pull points, working clearance and dedicated equipment space at gear, bending space at terminations, all against the project standards form", false, false]], [["Supports — hangers and racks where required, spacing to standard, rod lengths and structural attachment achievable", false, false]], [["Field data — layout points exported, named and matching the model; spool and prefab data consistent with what was modeled", false, false]], [["Sheets — right view at the right scale, tags and dimensions complete, schedules current, revision clouds and revision table filled, title block and sheet numbering right", false, false]], [["Package — the exported PDF checked as a PDF and not on screen in Revit, file naming to the client's convention. Schedules should list exactly what is on the drawing and quantities should match between them.", false, false]], [["History — every comment from the client's previous markup closed or explicitly answered", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Checking the model and never opening the issued PDF", false, false]], [["The author checking their own work", false, false]], [["Clashes that are left hoping to be resolved by another trade without notify anyone about it", false, false]], [["Comments from the previous round silently ignored", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["You are given an area or a set of drawings and are responsible for checking them. The drawings are checked and reissued by your team under your direction, as many times as you judge necessary. When you consider them ready, they go to the team lead. If the team lead finds no comments, the check counts as successful.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Five successful checks — five sets accepted by the team lead with no comments.", true, false]]}]}]}, {"t": "sub", "num": 5, "title": "Release Discipline — Checks Every Time"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Teams do not fail because they cannot check. They fail because this one was small, this one was urgent, and this one was a quick fix made after the check.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["No package leaves the team without a completed check list carrying the checker's name and the date", false, false]], [["A change made after the check re-triggers the check on whatever it touched — including at the end of the day on a deadline", false, false]], [["A copy of exactly what was issued is archived, with version and date; the record is the issued PDF, not the model", false, false]], [["The transmittal states the contents and any known open items", false, false]], [["A comment the check list would not have caught becomes a new line in it", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Minor change at the end could easily causes big changes", false, false]], [["The check list ticked in one pass as a formality", false, false]], [["The same class of comment coming back three rounds running while the check list never changes", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["From this week to the end of the program, no package leaves your team without a signed check list carrying the checker's name and the date. Whenever something is found afterwards that the check list would not have caught, add it as a new line. This runs in the background alongside everything that follows.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Assessed at the end of Phase 1: no unchecked release in the period, and every miss added to the check list.", true, false]]}]}]}], "group": "", "title": "Does the Check List Actually Work", "kicker": "WEEK 3", "meta": ["Phase 1", "Competencies 4 and 5"]}, {"id": "s8", "blocks": [{"t": "p", "segs": [["The last week of pure product work, and the one that most often changes how an engineer looks at their own model.", false, false]]}, {"t": "sub", "num": 6, "title": "Constructability for Electrical"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["A clash-free model is not the same as an installable one. The model is a set of instructions for a crew with a lift, a bender and a schedule.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Project Technical Standards & Preferences Form", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Access and maintenance — working clearance and dedicated space at panels, switchgear and transformers kept clear of other trades and of your own conduit; pull points reachable; junction boxes not stranded above hard ceilings", false, false]], [["Installation sequence — what goes in before what, which racks precede the duct drops, which runs must be in place before the deck is poured", false, false]], [["Supports — hangers landing on real structure, sensible rod lengths, racks sized for the conduit going on them plus the spares the field will add", false, false]], [["Bends and pulls — bend radius achievable with the bender the field actually uses, pull points placed so cable can be pulled within tension limits, cumulative bend limits respected in the real routing and not just on paper", false, false]], [["Underground — cover depth, duct bank spacing and separation from other utilities, stub-up locations verified against current wall and gear positions, sweeps clear of rebar and footings, all reconciled against the pour date", false, false]], [["Prefab — runs broken at sensible lengths, spools that fit on a truck and through a door, rack assemblies that can be built in the shop", false, false]], [["Delivery and rigging — gear can physically reach its pad: door widths, lift capacity, route in", false, false]], [["Penetrations and sleeves — located, sized, coordinated with structural, and correct for fire-rated assemblies", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["A pull box installed where a lift cannot reach it", false, false]], [["Conduit half an inch off a beam flange: clash-free in the model, unbuildable in the field", false, false]], [["Prefabbed equipment or conduit rack is too big to deliver it on the field", false, false]], [["A stub-up landing inside a wall that moved two revisions ago", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Take a coordinated area and go through it looking for places where there is no clash, but the work would still be difficult or impossible to install — access, support, sequence or simply no room to work. Alongside that, look for what is illogical in the conduit routing, the supports and the fixings. Find at least five, and write up each one with a short note on why it is a problem. From this week, keep a running list of the lessons these findings give you.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["At least four of your five findings confirmed as real by your mentor. The lessons list is in use by the team by the end of Phase 1.", true, false]]}]}]}], "group": "", "title": "Can It Actually Be Built", "kicker": "WEEK 4", "meta": ["Phase 1", "Competency 6"]}, {"id": "s9", "blocks": [{"t": "p", "segs": [["The switch from doing the work to directing it. Everything here is written, because an instruction that lives only in your head is not an instruction.", false, false]]}, {"t": "sub", "num": 7, "title": "Writes Tasks the Team Can Start Without Asking"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["A task is an instruction an engineer can act on without coming back to you. Anything missing from it becomes an interruption, an assumption, or rework.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Scope boundary: building, level, area, system — and what is explicitly not included", false, false]], [["Source: model version, redline PDF and its revision, RFI number, sheet and revision, spec section", false, false]], [["Definition of done, written at the same time as the task — without it, status reporting at the daily is guesswork", false, false]], [["Priority, due date and an hour estimate", false, false]], [["Who to go to when it is blocked", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["A task with no area boundary, no redline reference and no definition of done", false, false]], [["No hour estimate, so nobody knows a task was a thirty-hour task until day three", false, false]], [["Pointing at the information source without path link to it", false, false]], [["Assigning work that depends on an unanswered RFI without saying so", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Write the daily tasks for your team, to the requirements set out in the Team Communication Workflow. This continues for the rest of Phase 1.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Across the whole of Phase 1 the team raises no clarifying questions on your tasks, and your estimate on a task does not exceed the actual by more than 25%.", true, false]]}]}]}, {"t": "sub", "num": 8, "title": "Understands Project and Scope Priorities"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["On an electrical package the sequence is usually dictated by things outside your model — pour dates, gear deliveries, deck schedules, inspections, area releases. A lead who cannot name the driver behind a date cannot prioritize against it.", false, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Can name what drives each deadline: a slab or deck pour, a gear delivery, an inspection, a GC area release, another trade waiting on your sign-off", false, false]], [["Separates the critical path from work that is merely valuable", false, false]], [["Sequences around the coordination hierarchy — structure, large duct and pipe, then conduit — and therefore claims space and raises conflicts early instead of absorbing whatever is left", false, false]], [["Re-checks priorities weekly against the current GC and client schedule", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Spreading effort evenly across the model while a pour date for one area is two weeks out", false, false]], [["Finishing an area nobody needs before starting the one the field is waiting on", false, false]], [["Treating clash count as the priority metric instead of which areas are signed off", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Work from recorded meetings — either recordings from other projects that your mentor gives you, or recordings of meetings you sit in on yourself. Listen to each one and write out what follows from it for the work: the priorities, what drives each date, and what changes for the team. Do this for several meetings.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Your write-up carries every priority and every date your mentor took from the same recording, with nothing missed that moves a deliverable.", true, false]]}]}]}], "group": "", "title": "Running the Team's Work", "kicker": "WEEK 5", "meta": ["Phase 1", "Competencies 7 and 8"]}, {"id": "s10", "blocks": [{"t": "p", "segs": [["Three competencies that are really one subject: knowing what your team can carry, and raising it in time when it cannot. This is where most overtime is born and where it can still be prevented.", false, false]]}, {"t": "sub", "num": 9, "title": "Prevents and Resolves Overtime"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Overtime is almost never a work-rate problem. It is a promise made without counting capacity, discovered too late to renegotiate. Both halves of that are the lead's job.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Counts before committing: available engineer-hours for the window against estimated hours, with a realistic allowance for revisions and checking", false, false]], [["Asks the capacity question at the daily every day, and tracks plan against actual at the end of each day, so a Friday deadline in trouble is visible on Tuesday", false, false]], [["Knows the four levers and reaches for them early — partial issue, reduced detail, a moved date, or issue on time with a written list of known open items", false, false]], [["Tells the client while there is still a choice to make, not on the due date", false, false]], [["Treats a second consecutive overtime week as a planning failure to escalate, not endurance to admire", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["The team works Saturday and nobody outside the team ever finds out, so the estimate that caused it is never corrected", false, false]], [["Adding engineers to a late package in the final week and losing more time to onboarding than is gained", false, false]]]}, {"t": "p", "segs": [["— ", true, false], ["Tries to please the client and get the job done today without verifying whether the deadlines are realistic", false, false]]}, {"t": "p", "segs": [["— ", true, false], ["Skipping the check step to hit the date, producing a rejected package and a second overtime week", false, false]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Write the letter that tells the client a deliverable will not make its date and has to move. Take the nearest real deadline on your project and work out a plausible reason it is at risk. The letter states what moves, by how long, why, what is being done about it, and what you need back. It goes to your mentor and the PM for review — it is not sent.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["The letter is ready to send as written: the reason is stated without excuses, the new date is concrete, and the PM would put their own name to it.", true, false]]}]}]}, {"t": "sub", "num": 10, "title": "Escalates Inside Eracore at the Right Time"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Some problems are not yours to solve alone. A lead who absorbs everything looks reliable right up to the point where the project quietly fails.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Knows the escalation table in the Team Communication Workflow and can say, for any given problem, whether it is a lead decision, a client RFI or a PM matter", false, false]], [["Escalates with a position, not a panic: the problem, the impact in hours and dates, two options, a recommendation", false, false]], [["Escalates while the decision still exists as a choice", false, false]], [["Keeps escalation and blame separate", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Heroic absorption — silently covering a large scope increase until the team burns out", false, false]], [["Escalating with no options, which just moves the problem up a level", false, false]], [["Escalating after the commitment has already been made", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Take the electrical design on your project and compare it against the project specification and the client requirements that are already recorded. Where they differ, write the document that raises it — the RFI or the letter — one per discrepancy, stating what the design shows, what the requirement says, and what you propose. Name the row of the escalation table each one falls under. They go to your mentor and the PM for review.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["The discrepancies are real, each one is routed correctly against the escalation table, and every document is usable as written.", true, false]]}]}]}, {"t": "sub", "num": 11, "title": "Recognizes Scope Changes and Raises Them"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["This is where most overtime actually starts. A client asks for something small, the team does it, it happens again and again, and the package is well over the hours that were sold with nothing on paper.", false, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Knows what was contracted: the areas, the systems, the LOD, the number of coordination rounds, the deliverable list", false, false]], [["Recognizes the creep patterns — extra areas or levels, systems that were never in scope, a jump in required detail, re-coordination caused by another trade's late design change, added revision rounds, and requests for data that were never in the deliverable list", false, false]], [["Flags it the moment it appears, in writing and in neutral terms: this sits outside the current scope, here is the estimated impact, confirming you want us to proceed on that basis", false, false]], [["Hands it to the PM to price rather than negotiating money personally", false, false]], [["Keeps a running change log per project", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["It is only a few hours — repeatedly", false, false]], [["Raising it at the end of the project, where it reads as an excuse rather than a notice", false, false]], [["Refusing the work bluntly instead of routing it through the PM", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Review the last three months on your project and list every request that fell outside the original scope, with an honest hour estimate for each. Total it. Write the change notice that should have gone out for the two largest, and set up a running change log for the project going forward.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["The total is reviewed and accepted as realistic by the PM. The change log is live and updated weekly.", true, false]]}]}]}], "group": "", "title": "Load, Escalation and Scope", "kicker": "WEEK 6", "meta": ["Phase 1", "Competencies 9, 10 and 11"]}, {"id": "s11", "blocks": [{"t": "p", "segs": [["Phase 1 closes with a verbal scenario test on the Team Communication Workflow. Ten situations drawn from ordinary project life, answered with the document open — it tests application, not memory. It is issued and marked by your mentor, who also reviews the background track that has been running since Week 3.", false, false]]}, {"t": "def", "rows": [{"label": "Format", "blocks": [{"t": "p", "segs": [["Verbal, open book, 30 to 60 minutes. Ten situations, each with two to four questions. All ten must be answered.", false, false]]}]}, {"label": "Marking", "blocks": [{"t": "p", "segs": [["Against a list of required elements per situation, held by the mentor.", false, false]]}]}, {"label": "Also reviewed", "blocks": [{"t": "p", "segs": [["The background track since Week 3: signed check lists on every release, the written decision log, and your notes from observing client meetings.", false, false]]}]}, {"label": "Afterwards", "blocks": [{"t": "p", "segs": [["Your mentor goes through the whole paper with you. Where answers were incomplete, the gaps are worked through before Phase 2 starts.", false, false]]}]}]}], "group": "", "title": "Phase 1 Scenario Test", "kicker": "CHECKPOINT", "meta": ["End of Week 6", "Closes Phase 1"]}, {"id": "s12", "blocks": [{"t": "p", "segs": [["Everything the client sees of Eracore comes through the lead, and everything the team becomes comes through the lead as well. Both are last in the sequence because both depend on all of Phase 1: you cannot speak for a scope you cannot check, and you cannot commit to a date you cannot count.", false, false]]}, {"t": "sub", "num": 12, "title": "Attends Client Meetings and Reports Your Scope"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["You have been sitting in these meetings as a listener since Week 1. Now you speak in them. The test is not attendance — it is whether, an hour after the call, you can say exactly what was agreed, who owes what, and what it costs your team.", false, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Knows before the call which areas are on the agenda, what state the model is in for those areas, and what is still open from last time", false, false]], [["Speaks for the electrical scope: what is modeled, what is coordinated, what is blocked and by whom", false, false]], [["Records decisions as they are made, including the ones that land on other trades", false, false]], [["Never commits to a date or an added area without checking team capacity first", false, false]], [["Follows up the meeting minutes in writing the same day", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Agreeing to a date live on the call, then discovering the team is already fully loaded", false, false]], [["Leaving with an impression instead of a record", false, false]], [["Reporting activity instead of status", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["For your first three meetings in this phase, issue minutes within two hours in the format Decisions / Actions (who, by when) / Open questions and RFIs / Risks, and compare against your mentor's version of the same call. At the fourth, present one area of your own scope for three to five minutes.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Your minutes match the mentor's on every decision and action item on two consecutive meetings. Your scope report needs no correction from the mentor in front of the client.", true, false]]}]}]}, {"t": "sub", "num": 13, "title": "Runs a Meeting and Reports Progress"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["A coordination call is a working session, not a status update. It is prepared for in advance, kept on the agenda, and ends with decisions that have owners and dates — the same discipline the Team Communication Workflow applies to the daily, with a client in the room.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Agenda out the day before, listing the areas covered and the decisions needed", false, false]], [["Views, clash results and markups saved as viewpoints in advance — never navigating the model live looking for the problem", false, false]], [["Progress reported as Plan / Actual / Risk / What we need from you, by area and deliverable", false, false]], [["Every unresolved item leaves with an owner and a date", false, false]], [["Can handle trade-to-trade coordination discussion and arguments at the meeting", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Hunting for the clash while the room watches", false, false]], [["A percentage with no definition of what complete means", false, false]], [["No meeting minutes, so the same argument runs again next week", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Run one full agenda item of a live client coordination call with your mentor present, then a full call. You are scored on five criteria — preparation, timekeeping, clarity of status, decisions captured, control of the room.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Four out of five or better on two separate client calls, including decisions captured in both.", true, false]]}]}]}, {"t": "sub", "num": 14, "title": "Knows What to Raise with the Client and What to Decide Yourself"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["Ask too much and you look unable to run your own scope; ask too little and you eat rework, or pour concrete around a wrong assumption. You have been practising this in the decision log since Week 3 — now it is assessed live.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Project Technical Standards & Preferences Form", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Decides it when it sits inside the standards form, the BEP and the approved drawings; when it is reversible at low cost; and when there is already a precedent on this project", false, false]], [["Asks when it changes scope, cost or a date; affects another trade's space or sequence; contradicts the contract documents; is a code interpretation or design-intent question; or commits something that gets poured, ordered or fabricated", false, false]], [["Batches questions into a single RFI list on a set rhythm instead of messaging the GC through the day", false, false]], [["Asks with a proposal: context, two options, a recommendation, and what happens without an answer by a given date", false, false]], [["Records the answer where it will still be found in a month — the standards form and the check list, not only the channel thread", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Quietly picking a solution that conflicts with design intent, and finding out after the pour", false, false]], [["Sending an open-ended question with no options attached", false, false]], [["Holding a whole area hostage to one unanswered question instead of working around it and flagging the assumption", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Review the decision log you have kept since Week 3 with your mentor; the scoring is on misclassifications in both directions. Then rewrite your five most recent questions to the client into the proposal format above, and issue the next RFI batch yourself.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["No more than one misclassification across the logged period, and none of the should-have-asked type. All five rewritten questions accepted without further edits.", true, false]]}]}]}, {"t": "sub", "num": 15, "title": "Leads People"}, {"t": "def", "rows": [{"label": "Purpose", "blocks": [{"t": "p", "segs": [["The half of the role that is not technical. It is last because it takes the longest to show.", false, false]]}]}, {"label": "Uses", "blocks": [{"t": "p", "segs": [["Team Communication Workflow", true, false]]}]}, {"label": "What good looks like", "blocks": [{"t": "bullets", "items": [[["Runs a short one-to-one with each engineer on a regular cadence, separate from task talk", false, false]], [["Distributes work by development as well as by speed — does not keep every interesting task, and does not park one engineer on the same repetitive scope for months", false, false]], [["Gives feedback close to the event: what happened, what the impact was, what to do differently", false, false]], [["Treats a repeated mistake as a process problem — the point goes into the check list and the pattern into a one-to-one", false, false]], [["Brings a new engineer onto the project deliberately: a named mentor, real checkpoints, and actual review of what they submit", false, false]], [["Notices workload and morale before they become a resignation; credits publicly and corrects privately", false, false]]]}]}, {"label": "Common failures", "blocks": [{"t": "bullets", "items": [[["Doing the difficult work personally because it is faster than explaining it", false, false]], [["Feedback saved up for a quarterly review, by which point it is a list of grievances", false, false]], [["A new joiner left to work the project out from the model", false, false]]]}]}, {"label": "Practice task", "blocks": [{"t": "p", "segs": [["Run one-to-ones with every engineer on your team through this phase, with a written note of what was discussed and agreed. Produce a one-page development snapshot per person: current strengths, one growth area, the next task that will stretch them. If a new or rotating engineer joins, onboard them yourself and record what your project needed that the standard onboarding does not cover.", false, false]]}]}, {"label": "Sign-off", "blocks": [{"t": "p", "segs": [["Every engineer has had at least three one-to-ones and can state their own growth area unprompted when the mentor asks. Any engineer you onboarded is productive on real tasks by the end of their second week.", true, false]]}]}]}], "group": "", "title": "Client and People", "kicker": "WEEKS 7 TO 10", "meta": ["Phase 2", "Competencies 12 to 15"]}, {"id": "s13", "blocks": [{"t": "p", "segs": [["Final sign-off i callout", "blocks": [{"t": "p", "segs": [["The cycle runs every working day.  ", true, false], ["Phases 1 to 8 are not a menu to pick from. The daily, the check before handover and the end-of-day record happen whether or not there is anything dramatic to report. The deep dive is the only meeting held solely when it is triggered.", false, false]]}]}], "kicker": "", "meta": [], "group": ""}, {"id": "s1", "blocks": [{"t": "table", "id": "workflow-62", "head": ["#", "Phase", "Who drives", "What it produces"], "checkcols": [], "rows": [[{"k": "text", "segs": [["1", true, false]], "blocks": null, "text": "1"}, {"k": "text", "segs": [["Preparation", true, false]], "blocks": null, "text": "Preparation"}, {"k": "text", "segs": [["Lead", false, false]], "blocks": null, "text": "Lead"}, {"k": "text", "segs": [["Tasks published, capacity counted", false, false]], "blocks": null, "text": "Tasks published, capacity counted"}], [{"k": "text", "segs": [["2", true, false]], "blocks": null, "text": "2"}, {"k": "text", "segs": [["Daily meeting", true, false]], "blocks": null, "text": "Daily meeting"}, {"k": "text", "segs": [["Lead", false, false]], "blocks": null, "text": "Lead"}, {"k": "text", "segs": [["Priorities agreed, blockers surfaced", false, false]], "blocks": null, "text": "Priorities agreed, blockers surfaced"}], [{"k": "text", "segs": [["3", true, false]], "blocks": null, "text": "3"}, {"k": "text", "segs": [["Execution", true, false]], "blocks": null, "text": "Execution"}, {"k": "text", "segs": [["Team", false, false]], "blocks": null, "text": "Team"}, {"k": "text", "segs": [["Work moves", false, false]], "blocks": null, "text": "Work moves"}], [{"k": "text", "segs": [["4", true, false]], "blocks": null, "text": "4"}, {"k": "text", "segs": [["Question workflow", true, false]], "blocks": null, "text": "Question workflow"}, {"k": "text", "segs": [["Team → Lead", false, false]], "blocks": null, "text": "Team → Lead"}, {"k": "text", "segs": [["Answers, or a routed escalation"  {"t": "def", "rows": [{"label": "Team", "blocks": [{"t": "bullets", "items": [[["Review the daily tasks published by the lead in advance — mandatory before the meeting", false, false]], [["Open all required files, models and viewpoints beforehand", false, false]], [["Prepare a short status: what is done, what is in progress, what is blocked", false, false]], [["Collect questions in advance instead of raising them live", false, false]]]}]}, {"label": "Lead", "blocks": [{"t": "bullets", "items": [[["Publish the weekly and daily tasks in the thread channel before the meeting", false, false]], [["Make sure every task is clear, bounded and prioritised", false, false]], [["Know the overall progress of the team before anyone reports it", false, false]], [["Prepare to facilitate — not to solve everything personally", false, false]]]}]}, {"label": "Count the load", "blocks": [{"t": "bullets", "items": [[["Before publishing tasks, count them: available engineer-hours today against the hours the tasks actually need", false, false]], [["Include checking and revision time, not only modeling time", false, false]], [["If the numbers do not meet, decide now what moves — do not publish a day the team cannot deliver", false, false]]]}]}, {"label": "Meeting setup", "blocks": [{"t": "bullets", "items": [[["Daily meeting scheduled in Outlook between 09:00 and 10:00, team local time", false, false]], [["The lead is on the call on time, or cancels in advance and hands the meeting to the assistant lead", false, false]]]}]}, {"label": "The first hour", "blocks": [{"t": "bullets", "items": [[["The hour before the daily runs on the tasks agreed at the end of the previous day — the daily is a checkpoint, not the start of work", false, false]], [["If someone has nothing to run on in the morning, that is an end-of-day failure, not a daily one", false, false]]]}]}, {"label": "Goal", "blocks": [{"t": "bullets", "items": [[["Start the meeting fully prepared — no delays, no confusion, no “I didn’t check the task”", false, false]]]}]}]}], "group": "", "title": "Preparation", "kicker": "PHASE 1", "meta": ["Before the daily meeting", "Owner: Team Lead"]}, {"id": "s3", "blocks": [{"t": "p", "segs": [["A short, structured sync. Its purpose is alignment and surfacing blockers — not solving them.", false, false]]}, {"t": "def", "rows": [{"label": "Check-in  1–3 min", "blocks": [{"t": "bullets", "items": [[["A short informal start to engage the team — be friendly and human", false, false]], [["Light small talk is welcome; keep it brief", false, false]]]}]}, {"label": "Priority alignment", "blocks": [{"t": "bullets", "items": [[["Do we have clear priorities for today, and what are the top focus areas?", false, false]], [["When is the next formal submission or deadline?", false, false]], [["Are we aligned on what is critical and what is secondary?", false, false]]]}]}, {"label": "Capacity check", "blocks": [{"t": "bullets", "items": [[["Can we actually deliver today’s priorities with the people available today?", false, false]], [["Anyone who knows their task will not land today says so here, not on the due date", false, false]]]}]}, {"label": "Status", "blocks": [{"t": "bullets", "items": [[["Each person reports: done, in progress, blockers", false, false]], [["Status is reported against the definition of done written in the task — not as a percentage", false, false]], [["“Almost done” is not a status; it is replaced by what is finished and what remains", false, false]]]}]}, {"label": "Questions", "blocks": [{"t": "bullets", "items": [[["Only critical blockers are discussed in the daily", false, false]], [["Long topics are parked and moved to the deep dive, with named participants", false, false]], [["A question relevant to the whole team goes into the Project Information channel as a thread", false, false]], [["A question with no internal answer goes onto the client meeting agenda as an RFI", false, false]]]}]}, {"label": "Lead role", "blocks": [{"t": "bullets", "items": [[["Keep focus, manage time, guide the discussion, end on time", false, false]]]}]}, {"label": "Record it", "blocks": [{"t": "bullets", "items": [[["Within one hour of the daily, the lead posts what was decided and who owes what by when", false, false]]]}]}]}], "group": "", "title": "Daily Meeting — Sync", "kicker": "PHASE 2", "meta": ["09:00 to 10:00, team local time", "Owner: Team Lead"]}, {"id": "s4", "blocks": [{"t": "p", "segs": [["The longest part of the day and the one that needs the least management.", false, false]]}, {"t": "def", "rows": [{"label": "Team", "blocks": [{"t": "bullets", "items": [[["Work the assigned tasks", false, false]], [["Ask questions only when genuinely blocked", false, false]]]}]}, {"label": "Lead", "blocks": [{"t": "bullets", "items": [[["Support with blockers", false, false]], [["Avoid unnecessary involvement", false, false]]]}]}, {"label": "Blocker response time", "blocks": [{"t": "bullets", "items": [[["The lead acknowledges a blocker within 30 minutes, even if the answer itself takes longer", false, false]], [["If no answer is possible immediately, the lead names the fallback: a documented assumption to proceed on, or a switch to the next task", false, false]]]}]}, {"label": "Finishing early", "blocks": [{"t": "bullets", "items": [[["An engineer who finishes ahead of schedule takes the next item from the ranked priority list", false, false]], [["If nothing is ready, they check another package against the check list", false, false]], [["If this happens often, the preparation phase is under-planning; fix it there, not here", false, false]]]}]}, {"label": "Principle", "blocks": [{"t": "bullets", "items": [[["Work progress beats meetings", false, false]]]}]}]}], "group": "", "title": "Execution", "kicker": "PHASE 3", "meta": ["After the daily", "Owner: Team"]}, {"id": "s5", "blocks": [{"t": "p", "segs": [["A funnel. Every question passes four filters, and each one removes the questions that should not reach the next level — most never reach the lead, and only a few reach the client. The answer is then written down so the same question is not asked again.", false, false]]}, {"t": "def", "rows": [{"label": "Step 1 — Try yourself", "blocks": [{"t": "bullets", "items": [[["Spend 10 to 30 minutes looking for the answer first: drawings, model, previous examples, the standards, search", false, false]], [["This applies especially to junior engineers — it is where most of the learning happens", false, false]]]}]}, {"label": "Step 2 — Structure it", "blocks": [{"t": "bullets", "items": [[["What you need · what you tried · what didn’t work", false, false]], [["Make the question clear and ready for review, then ask it once", false, false]]]}]}, {"label": "Step 3 — Now or later", "blocks": [{"t": "bullets", "items": [[["Blocker — ask immediately", false, false]], [["Not a blocker — add it to the list for the deep dive", false, false]]]}]}, {"label": "Step 4 — Route it", "blocks": [{"t": "bullets", "items": [[["When the lead cannot answer it either, there are three options and no fourth: decide it, send it to the client as an RFI, or hand it to the PM", false, false]], [["The lead picks one the same day — the escalation table at the end of this document says which goes where", false, false]], [["A question sent to the client will usually not come back within the same working day, so pair it with a fallback the engineer can work on meanwhile", false, false]]]}]}, {"label": "Lead response", "blocks": [{"t": "bullets", "items": [[["Explain why, not just what to do", false, false]], [["Show the direction and the approach", false, false]], [["Clarify priority and expectations", false, false]], [["Do not do the work instead of the team", false, false]]]}]}, {"label": "Write it down", "blocks": [{"t": "bullets", "items": [[["Once answered, write it where it will still be found in a month: the project standards form, the check list, or the project notes", false, false]], [["A channel thread tells the team today — it is not a place to store an answer", false, false]], [["If the answer would have prevented a returned comment, add it to the check list", false, false]]]}]}, {"label": "Result", "blocks": [{"t": "bullets", "items": [[["The team learns — it does not merely complete tasks", false, false]]]}]}]}], "group": "", "title": "Question Workflow", "kicker": "PHASE 4", "meta": ["Throughout the day", "Owner: Team, then Lead"]}, {"id": "s6", "blocks": [{"t": "p", "segs": [["The session where the queued questions get resolved properly, with the model open.", false, false]]}, {"t": "def", "rows": [{"label": "Hold it when", "blocks": [{"t": "bullets", "items": [[["Two or more non-critical questions are queued", false, false]], [["A decision affects more than one person or more than one area", false, false]], [["A new client answer or standard needs explaining to the whole team", false, false]], [["None of the above — cancel it", false, false]]]}]}, {"label": "Scope", "blocks": [{"t": "bullets", "items": [[["Covers the collected non-critical questions", false, false]], [["Focus on complex or unclear topics", false, false]]]}]}, {"label": "Close it properly", "blocks": [{"t": "bullets", "items": [[["Every topic ends with a decision, an owner and a date — or an explicit note that it is going to the client", false, false]], [["Decisions are written into the thread the same day and, where durable, into the standards or check list", false, false]]]}]}, {"label": "Goal", "blocks": [{"t": "bullets", "items": [[["Better decisions, less chaos, deeper understanding", false, false]]]}]}]}], "group": "", "title": "Deep Dive Meeting", "kicker": "PHASE 5", "meta": ["Same day, when triggered", "Owner: Team Lead"]}, {"id": "s7", "blocks": [{"t": "def", "rows": [{"label": "Team", "blocks": [{"t": "bullets", "items": [[["Continue work after the clarifications", false, false]], [["Apply the decisions from the deep dive", false, false]], [["Maintain momentum", false, false]]]}]}]}], "group": "", "title": "Execution — Second Phase", "kicker": "PHASE 6", "meta": ["After the deep dive", "Owner: Team"]}, {"id": "s8", "blocks": [{"t": "p", "segs": [["Communication does not produce quality. A day of perfect syncs still ends in a rejected package if nobody checked the work before it went out.", false, false]]}, {"t": "def", "rows": [{"label": "Nothing is done until it is checked", "blocks": [{"t": "bullets", "items": [[["“Finished” means checked against the check list, not finished modeling", false, false]], [["The check list is signed with the checker’s name and the date", false, false]], [["The checker is not the person who modeled it", false, false]]]}]}, {"label": "The late change", "blocks": [{"t": "bullets", "items": [[["Any change made after the check re-triggers the check on whatever it touched", false, false]], [["No exceptions for small fixes, and none for the last hour before a deadline", false, false]]]}]}, {"label": "Archive what went out", "blocks": [{"t": "bullets", "items": [[["Keep a copy of the exact package that was issued, with version and date", false, false]], [["The model is not the record; the issued PDF is", false, false]]]}]}, {"label": "Definition of done", "blocks": [{"t": "bullets", "items": [[["Every task carries its own definition of done, written when the task is written", false, false]]]}]}]}], "group": "", "title": "Check Before Handover", "kicker": "PHASE 7", "meta": ["Before anything leaves the team", "Owner: Team Lead"]}, {"id": "s9", "blocks": [{"t": "p", "segs": [["For a team working against a client in another time zone, the end-of-day record is the main thing anyone outside the team ever sees. It is also what makes the next morning productive before the daily takes place.", false, false]]}, {"t": "def", "rows": [{"label": "Team", "blocks": [{"t": "bullets", "items": [[["A short written update in the thread: done today, in progress, blocked, at risk for tomorrow", false, false]], [["Two or three lines — this is a record, not a report", false, false]]]}]}, {"label": "Lead", "blocks": [{"t": "bullets", "items": [[["Consolidate into one end-of-day summary for the project", false, false]], [["Compare planned against actual hours and note the variance while it is still small", false, false]], [["Flag anything that threatens a date — to the PM today, not on the due date", false, false]], [["Make sure tomorrow morning has tasks to run on before the daily takes place", false, false]]]}]}, {"label": "Goal", "blocks": [{"t": "bullets", "items": [[["Nobody outside the team ever learns about a slip after it has already happened", false, false]]]}]}]}], "group": "", "title": "End of Day", "kicker": "PHASE 8", "meta": ["Last 15 minutes", "Owner: Team, then Lead"]}, {"id": "s10", "blocks": [{"t": "p", "segs": [["Questions travel from the team to the lead, and from the lead to the client. Some belong on a third route. Scope that has grown beyond what was sold, a date that cannot be met, a client who has gone quiet — these are not the client’s questions to answer. They go to the Eracore PM.", false, false]]}, {"t": "table", "id": "workflow-63", "head": ["Situation", "Goes to", "By when"], "checkcols": [], "rows": [[{"k": "text", "segs": [["Inside the standards, reversible, precedent exists", false, false]], "blocks": null, "text": "Inside the standards, reversible, precedent exists"}, {"k": "text", "segs": [["Lead decides", true, false]], "blocks": null, "text": "Lead decides"}, {"k": "text", "segs": [["Immediately", false, false]], "blocks": null, "text": "Immediately"}], [{"k": "text", "segs": [["Design intent, code interpretation, contract documents", false, false]], "blocks": null, "text": "Design intent, code interpretation, contract documents"}, {"k": "text", "segs": [["Client RFI", true, false]], "blocks": null, "text": "Client RFI"}, {"k": "text", "segs": [["Next client meeting or RFI batch", false, false]], "blocks": null, "text": "Next client meeting or RFI batch"}], [{"k": "text", "segs": [["Affects another trade’s space or sequence", false, false]], "blocks": null, "text": "Affects another trade’s space or sequence"}, {"k": "text", "segs": [["Client RFI, copy the GC", true, false]], "blocks": null, "text": "Client RFI, copy the GC"}, {"k": "text", "segs": [["Same day", false, false]], "blocks": null, "text": "Same day"}], [{"k": "text", "segs": [["Scope has grown beyond what was sold", false, false]], "blocks": null, "text": "Scope has grown beyond what was sold"}, {"k": "text", "segs": [["Eracore PM", true, false]], "blocks": null, "text": "Eracore PM"}, {"k": "text", "segs": [["Same day it is noticed", false, false]], "blocks": null, "text": "Same day it is noticed"}], [{"k": "text", "segs": [["A date is not achievable with the assigned team", false, false]], "blocks": null, "text": "A date is not achievable with the assigned team"}, {"k": "text", "segs": [["Eracore PM", true, false]], "blocks": null, "text": "Eracore PM"}, {"k": "text", "segs": [["As soon as it is knowable", false, false]], "blocks": null, "text": "As soon as it is knowable"}], [{"k": "text", "segs": [["Client unresponsive and work is blocked", false, false]], "blocks": null, "text": "Client unresponsive and work is blocked"}, {"k": "text", "segs": [["Eracore PM", true, false]], "blocks": null, "text": "Eracore PM"}, {"k": "text", "segs": [["After 48 hours", false, false]], "blocks": null, "text": "After 48 hours"}], [{"k": "text", "segs": [["Performance or availability puts the package at risk", false, false]], "blocks": null, "text": "Performance or availability puts the package at risk"}, {"k": "text", "segs": [["Eracore PM", true, false]], "blocks": null, "text": "Eracore PM"}, {"k": "text", "segs": [["Before it affects the date", false, false]], "blocks": null, "text": "Before it affects the date"}]]}, {"t": "note", "text": "Escalating with a position, not a panic: the problem, the impact in hours and dates, two options, your recommendation."}], "group": "", "title": "Escalation Path", "kicker": "ROUTING", "meta": ["Throughout the project", "Owner: Team Lead"]}, {"id": "s11", "blocks": [{"t": "def", "rows": [{"label": "Monitoring", "blocks": [{"t": "bullets", "items": [[["Ask how it is going occasionally — do not over-control", false, false]], [["React early to risks", false, false]], [["If someone struggles: support, adjust, redistribute, or shift the deadline", false, false]]]}]}, {"label": "Feedback", "blocks": [{"t": "bullets", "items": [[["Use the “I noticed…” format", false, false]], [["Give feedback immediately, not later", false, false]], [["Structure it: what was good, what to improve, how and why", false, false]], [["Balance positive and corrective feedback", false, false]]]}]}, {"label": "When it repeats", "blocks": [{"t": "bullets", "items": [[["A mistake made three times is not a feedback problem, it is a process problem", false, false]], [["Add it to the check list so it is caught mechanically, and raise the pattern in a one-to-one — not in passing for the fourth time", false, false]]]}]}, {"label": "One-to-ones", "blocks": [{"t": "bullets", "items": [[["A short one-to-one with each engineer on a regular cadence, separate from task talk", false, false]], [["Feedback that only happens when something goes wrong is heard as criticism, whatever the wording", false, false]]]}]}, {"label": "Coverage", "blocks": [{"t": "bullets", "items": [[["When an engineer is out, their tasks are reassigned or explicitly deferred at the daily — not silently dropped", false, false]], [["The assistant lead covers the lead; name who covers each engineer’s area before it is needed", false, false]]]}]}, {"label": "Team state", "blocks": [{"t": "bullets", "items": [[["Monitor stress, engagement and atmosphere", false, false]], [["A calm lead makes a stable team — panic spreads quickly", false, false]]]}]}]}, {"t": "callout", "blocks": [{"t": "p", "segs": [["Key idea.  ", true, false], ["A lead delivers the task until the team can succeed without them. at do you reply, and what do you not do?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["A minute later he sends a screenshot of his screen. Does that change your answer?", false, false]]}]}]}], "group": "", "title": "A question with no shape", "kicker": "Situation 1", "meta": [], "num": 1}, {"id": "s2", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["In the morning it turns out one of your engineers cannot continue. What the client's redline shows directly contradicts a requirement recorded in the project technical standards form. He is not willing to decide it himself and is waiting on you. The client's working day starts in several hours, and the area he is working on is issued tomorrow.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What has to happen in the next thirty minutes?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Where does this question go, and why not down the other two routes?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["What does the engineer do for the rest of the day?", false, false]]}]}]}], "group": "", "title": "Blocked while the client sleeps", "kicker": "Situation 2", "meta": [], "num": 2}, {"id": "s3", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["At the daily, two engineers start working through a technical solution in one of the areas. The discussion is a real one, but it runs long, goes deep into detail, and directly concerns only the two of them. Everyone else waits in silence and the agenda stops moving.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you do right now?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Does this go to the deep dive? Justify your answer against the trigger list in the workflow.", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["What do you owe the team within an hour of the meeting ending?", false, false]]}]}]}], "group": "", "title": "The daily drifts", "kicker": "Situation 3", "meta": [], "num": 3}, {"id": "s4", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["At the daily it is one engineer's turn and he reports: “working on my area, it's going fine, almost done.” Then he stops and waits for you to move on to the next person.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["Why is that not a status, and what do you ask instead?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Opening the task, you find it has no definition of done written in it. Whose mistake is that, and in which phase did it happen?", false, false]]}]}]}], "group": "", "title": "A status with no finish line", "kicker": "Situation 4", "meta": [], "num": 4}, {"id": "s5", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Midweek. Looking at the time records, you notice a task you estimated at twelve hours has already taken sixteen, and the work still is not finished. At today's daily that engineer said nothing about it and asked for no help. The package his area belongs to is issued at the end of the week.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What failed, and at which two points should this have surfaced earlier?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What do you do today?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["When does this go anywhere, and to whom?", false, false]]}]}]}], "group": "", "title": "A quiet overrun", "kicker": "Situation 5", "meta": [], "num": 5}, {"id": "s6", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["End of the working day, and the package is ready to go: the check is complete, the check list is signed, the transmittal is written. Minutes before it is sent, an engineer messages to say he spotted a small error on one of the sheets and has already corrected it. It took two minutes, he says, and affects nothing else.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What does the workflow require here?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What exactly do you archive, and what happens if the client later claims the sheet is wrong?", false, false]]}]}]}], "group": "", "title": "A fix after the check", "kicker": "Situation 6", "meta": [], "num": 6}, {"id": "s7", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["On a call with the client you get an answer to an RFI, and it turns out one of the project requirements differs from how the team has been working up to now. Only you and one engineer were on the call. Everyone else carries on with the previous understanding.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["Where does this information go, and in what order?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Some time later a new person joins the project and does it the old way. What exactly failed?", false, false]]}]}]}], "group": "", "title": "An answer only two people have", "kicker": "Situation 7", "meta": [], "num": 7}, {"id": "s8", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Midday. One of your engineers closes the task that was planned for him today and asks what to do next. You are preparing for a client meeting at that moment and do not want to switch context.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you give him?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["And if you have nothing ready?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["If this keeps happening, what is actually broken?", false, false]]}]}]}], "group": "", "title": "Finished early", "kicker": "Situation 8", "meta": [], "num": 8}, {"id": "s9", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["The same engineer has now made the same mistake in a deliverable for the third time. After the first you gave him feedback, he agreed and understood. After the second you reminded him in passing. This is the third.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you do on the third occasion, and why is more feedback the wrong instrument?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Name two concrete actions.", false, false]]}]}]}], "group": "", "title": "The third time", "kicker": "Situation 9", "meta": [], "num": 9}, {"id": "s10", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Friday evening, the team is finishing the working day. An email arrives from the client with a change that affects part of the already coordinated areas, and he asks for it to be closed by the start of next week because the field is waiting on that specific section. Some of your people have already worked over their hours this week.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What is your first action, and what do you certainly not do?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What do you need to establish before you answer the client?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["Who do you write to, and under which row of the escalation table?", false, false]]}, {"t": "p", "segs": [["d)  ", true, false], ["What of this goes into the end-of-day record?", false, false]]}]}]}], "group": "", "title": "A request at the end of the week", "kicker": "Situation 10", "meta": [], "num": 10}, {"id": "s11", "blocks": [{"t": "callout", "

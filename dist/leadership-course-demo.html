wo things that cost money on a live project, and they are the reason the required elements are written out rather than left to judgment.", false, false]]}]}], "kicker": "", "meta": [], "group": ""}, {"id": "s1", "blocks": [{"t": "table", "id": "mentor-258", "head": ["Result", "Meaning"], "checkcols": [], "rows": [[{"k": "text", "segs": [["Complete", true, false]], "blocks": null, "text": "Complete"}, {"k": "text", "segs": [["Every required element present, in the candidate's own words. Wording does not need to match.", false, false]], "blocks": null, "text": "Every required element present, in the candidate's own words. Wording does not need to match."}], [{"k": "text", "segs": [["Incomplete", true, false]], "blocks": null, "text": "Incomplete"}, {"k": "text", "segs": [["One or more required elements missing, or a required element replaced by a plausible alternative that is not what the workflow says.", false, false]], "blocks": null, "text": "One or more required elements missing, or a required element replaced by a plausible alternative that is not what the workflow says."}], [{"k": "text", "segs": [["Wrong turn", true, false]], "blocks": null, "text": "Wrong turn"}, {"k": "text", "segs": [["The answer contains one of the listed wrong turns. Mark incomplete and discuss it directly — these are the habits the program exists to change.", false, false]], "blocks": null, "text": "The answer contains one of the listed wrong turns. Mark incomplete and discuss it directly — these are the habits the program exists to change."}], [{"k": "text", "segs": [["Afterwards", true, false]], "blocks": null, "text": "Afterwards"}, {"k": "text", "segs": [["Go through the whole paper with the candidate, including what they got right. Work through every incomplete answer before Phase 2 starts.", false, false]], "blocks": null, "text": "Go through the whole paper with the candidate, including what they got right. Work through every incomplete answer before Phase 2 starts."}]]}], "group": "", "title": "Marking Scale", "kicker": "", "meta": []}, {"id": "s2", "blocks": [{"t": "table", "id": "mentor-279", "head": ["#", "Situation", "Complete", "Notes"], "checkcols": [], "rows": [[{"k": "text", "segs": [["1", true, false]], "blocks": null, "text": "1"}, {"k": "text", "segs": [["A question with no shape", false, false]], "blocks": null, "text": "A question with no shape"}, {"k": "check", "id": "mentor-259"}, {"k": "input", "id": "mentor-260", "ph": ""}], [{"k": "text", "segs": [["2", true, false]], "blocks": null, "text": "2"}, {"k": "text", "segs": [["Blocked while the client sleeps", false, false]], "blocks": null, "text": "Blocked while the client sleeps"}, {"k": "check", "id": "mentor-261"}, {"k": "input", "id": "mentor-262", "ph": ""}], [{"k": "text", "segs": [["3", true, false]], "blocks": null, "text": "3"}, {"k": "text", "segs": [["The daily drifts", false, false]], "blocks": null, "text": "The daily drifts"}, {"k": "check", "id": "mentor-263"}, {"k": "input", "id": "mentor-264", "ph": ""}], [{"k": "text", "segs": [["4", true, false]], "blocks": null, "text": "4"}, {"k": "text", "segs": [["A status with no finish line", false, false]], "blocks": null, "text": "A status with no finish line"}, {"k": "check", "id": "mentor-265"}, {"k": "input", "id": "mentor-266", "ph": ""}], [{"k": "text", "segs": [["5", true, false]], "blocks": null, "text": "5"}, {"k": "text", "segs": [["A quiet overrun", false, false]], "blocks": null, "text": "A quiet overrun"}, {"k": "check", "id": "mentor-267"}, {"k": "input", "id": "mentor-268", "ph": ""}], [{"k": "text", "segs": [["6", true, false]], "blocks": null, "text": "6"}, {"k": "text", "segs": [["A fix after the check", false, false]], "blocks": null, "text": "A fix after the check"}, {"k": "check", "id": "mentor-269"}, {"k": "input", "id": "mentor-270", "ph": ""}], [{"k": "text", "segs": [["7", true, false]], "blocks": null, "text": "7"}, {"k": "text", "segs": [["An answer only two people have", false, false]], "blocks": null, "text": "An answer only two people have"}, {"k": "check", "id": "mentor-271"}, {"k": "input", "id": "mentor-272", "ph": ""}], [{"k": "text", "segs": [["8", true, false]], "blocks": null, "text": "8"}, {"k": "text", "segs": [["Finished early", false, false]], "blocks": null, "text": "Finished early"}, {"k": "check", "id": "mentor-273"}, {"k": "input", "id": "mentor-274", "ph": ""}], [{"k": "text", "segs": [["9", true, false]], "blocks": null, "text": "9"}, {"k": "text", "segs": [["The third time", false, false]], "blocks": null, "text": "The third time"}, {"k": "check", "id": "mentor-275"}, {"k": "input", "id": "mentor-276", "ph": ""}], [{"k": "text", "segs": [["10", true, false]], "blocks": null, "text": "10"}, {"k": "text", "segs": [["A request at the end of the week", false, false]], "blocks": null, "text": "A request at the end of the week"}, {"k": "check", "id": "mentor-277"}, {"k": "input", "id": "mentor-278", "ph": ""}]]}], "group": "", "title": "Score Sheet", "kicker": "", "meta": []}, {"id": "s3", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Shortly after the daily, a message from one of your engineers lands in your direct chat: “it isn't working, what do I do?” That is all of it — not what he was doing, not what he tried, not where it stopped. You are in the middle of something else.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you reply, and what do you not do?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["A minute later he sends a screenshot of his screen. Does that change your answer?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["The question fails Step 2 — there is no what you need, what you tried, what didn't work. Send it back to be rewritten.", false, false]], [["Check that Step 1 happened at all: drawings, model, standards, comparable areas.", false, false]], [["Then the Lead response: explain why, show the direction and the approach, do not model it for him.", false, false]], [["The screenshot changes nothing — an image is not a structured question.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Answering the question as asked, or opening the model and fixing it personally because it is faster.", false, false]]}]}]}], "group": "", "title": "A question with no shape", "kicker": "Situation 1", "meta": [], "num": 1}, {"id": "s4", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["In the morning it turns out one of your engineers cannot continue. What the client's redline shows directly contradicts a requirement recorded in the project technical standards form. He is not willing to decide it himself and is waiting on you. The client's working day starts in several hours, and the area he is working on is issued tomorrow.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What has to happen in the next thirty minutes?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Where does this question go, and why not down the other two routes?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["What does the engineer do for the rest of the day?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["Acknowledge the blocker within 30 minutes, even though the answer itself will take longer.", false, false]], [["It contradicts the contract documents, so it is a client RFI.", false, false]], [["Not a lead decision — it falls outside the agreed standards. Not the PM yet — scope has not grown and the date is not yet at risk.", false, false]], [["The lead names the fallback: a documented assumption to proceed on, or the next task from the ranked priority list. Nobody waits idle.", false, false]], [["If there is no answer by morning and tomorrow's issue is at risk, it becomes a PM matter under the row for a date that cannot be met.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Leaving the engineer waiting with no fallback, or deciding it personally in a way that departs from the standards form.", false, false]]}]}]}], "group": "", "title": "Blocked while the client sleeps", "kicker": "Situation 2", "meta": [], "num": 2}, {"id": "s5", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["At the daily, two engineers start working through a technical solution in one of the areas. The discussion is a real one, but it runs long, goes deep into detail, and directly concerns only the two of them. Everyone else waits in silence and the agenda stops moving.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you do right now?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Does this go to the deep dive? Justify your answer against the trigger list in the workflow.", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["What do you owe the team within an hour of the meeting ending?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["Park it with named participants and move on with the agenda.", false, false]], [["Against the triggers: a topic involving two people in one area does not by itself trigger a deep dive.", false, false]], [["If it is the only queued question, the right answer is a separate conversation between the two of them — the document requires cancelling a session with no trigger.", false, false]], [["Within the hour: post what was decided and who owes what by when.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Letting it run because it is technically interesting, or booking a whole-team deep dive for a two-person topic.", false, false]]}]}]}], "group": "", "title": "The daily drifts", "kicker": "Situation 3", "meta": [], "num": 3}, {"id": "s6", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["At the daily it is one engineer's turn and he reports: “working on my area, it's going fine, almost done.” Then he stops and waits for you to move on to the next person.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["Why is that not a status, and what do you ask instead?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Opening the task, you find it has no definition of done written in it. Whose mistake is that, and in which phase did it happen?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["Status is reported against the definition of done, not as a feeling or a percentage. “Almost” has no meaning.", false, false]], [["Ask what is finished, what remains, whether it lands today, and whether anything is blocking it.", false, false]], [["The missing definition of done is the lead's mistake, made in Phase 1 — it is written at the same time as the task.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Blaming the engineer for the vague status, or accepting “almost done” and moving on.", false, false]]}]}]}], "group": "", "title": "A status with no finish line", "kicker": "Situation 4", "meta": [], "num": 4}, {"id": "s7", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Midweek. Looking at the time records, you notice a task you estimated at twelve hours has already taken sixteen, and the work still is not finished. At today's daily that engineer said nothing about it and asked for no help. The package his area belongs to is issued at the end of the week.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What failed, and at which two points should this have surfaced earlier?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What do you do today?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["When does this go anywhere, and to whom?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["Two points: the capacity check at the daily, and the plan-against-actual comparison at the end of day — which would have shown the gap several days before the deadline.", false, false]], [["Today: recount the remaining hours against the remaining capacity and decide what moves.", false, false]], [["Reach for a lever early — partial issue, reduced detail, a moved date, or issue on time with known open items listed.", false, false]], [["The PM today, under the row for a date that cannot be met with the assigned team, as soon as it is knowable. Not on the day of issue.", false, false]], [["Speak to the engineer in the “I noticed” format, without blame.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Waiting until the end of the week to see whether it recovers, or absorbing it with overtime and telling nobody.", false, false]]}]}]}], "group": "", "title": "A quiet overrun", "kicker": "Situation 5", "meta": [], "num": 5}, {"id": "s8", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["End of the working day, and the package is ready to go: the check is complete, the check list is signed, the transmittal is written. Minutes before it is sent, an engineer messages to say he spotted a small error on one of the sheets and has already corrected it. It took two minutes, he says, and affects nothing else.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What does the workflow require here?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What exactly do you archive, and what happens if the client later claims the sheet is wrong?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["A change made after the check re-triggers the check on whatever it touched. There is no exception for small fixes and none for the last hour before a deadline.", false, false]], [["Archive the exact issued PDF with version and date — not the model.", false, false]], [["The record of what the client received is the issued PDF; the model has moved on and cannot answer the question.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Sending it because the change was small, or archiving the model and treating it as the record.", false, false]]}]}]}], "group": "", "title": "A fix after the check", "kicker": "Situation 6", "meta": [], "num": 6}, {"id": "s9", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["On a call with the client you get an answer to an RFI, and it turns out one of the project requirements differs from how the team has been working up to now. Only you and one engineer were on the call. Everyone else carries on with the previous understanding.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["Where does this information go, and in what order?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Some time later a new person joins the project and does it the old way. What exactly failed?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["First the thread in the Project Information channel, so the team hears it today.", false, false]], [["Then into the project standards form and the check list, because a thread does not store anything.", false, false]], [["The new engineer's error is the missed write-it-down step: the thread told the people who were there and said nothing to the person who arrived later.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Treating the channel message as sufficient, or blaming the new engineer.", false, false]]}]}]}], "group": "", "title": "An answer only two people have", "kicker": "Situation 7", "meta": [], "num": 7}, {"id": "s10", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Midday. One of your engineers closes the task that was planned for him today and asks what to do next. You are preparing for a client meeting at that moment and do not want to switch context.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you give him?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["And if you have nothing ready?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["If this keeps happening, what is actually broken?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["The next item from the ranked priority list, which should already exist.", false, false]], [["If nothing is ready: check another package against the check list — a second reader is useful work.", false, false]], [["If it recurs, the problem is not here but in Phase 1: the preparation is under-planning the day.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Inventing a task on the spot every time, or telling him to find something himself.", false, false]]}]}]}], "group": "", "title": "Finished early", "kicker": "Situation 8", "meta": [], "num": 8}, {"id": "s11", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["The same engineer has now made the same mistake in a deliverable for the third time. After the first you gave him feedback, he agreed and understood. After the second you reminded him in passing. This is the third.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What do you do on the third occasion, and why is more feedback the wrong instrument?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["Name two concrete actions.", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["A mistake made three times is a process problem, not a feedback problem.", false, false]], [["Action one: the point goes into the check list so it is caught mechanically.", false, false]], [["Action two: the pattern is raised in a one-to-one — not in passing for the fourth time.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["A fourth round of the same feedback, or escalating it as a performance issue before the process has been fixed.", false, false]]}]}]}], "group": "", "title": "The third time", "kicker": "Situation 9", "meta": [], "num": 9}, {"id": "s12", "blocks": [{"t": "def", "rows": [{"label": "Situation", "blocks": [{"t": "p", "segs": [["Friday evening, the team is finishing the working day. An email arrives from the client with a change that affects part of the already coordinated areas, and he asks for it to be closed by the start of next week because the field is waiting on that specific section. Some of your people have already worked over their hours this week.", false, false]]}]}, {"label": "Questions", "blocks": [{"t": "p", "segs": [["a)  ", true, false], ["What is your first action, and what do you certainly not do?", false, false]]}, {"t": "p", "segs": [["b)  ", true, false], ["What do you need to establish before you answer the client?", false, false]]}, {"t": "p", "segs": [["c)  ", true, false], ["Who do you write to, and under which row of the escalation table?", false, false]]}, {"t": "p", "segs": [["d)  ", true, false], ["What of this goes into the end-of-day record?", false, false]]}]}, {"label": "Required elements", "blocks": [{"t": "bullets", "items": [[["Do not forward the request to the team as a problem — a calm lead holds the team, panic spreads immediately.", false, false]], [["First establish what physically has to be done by that date and what does not, and how many hours that is against what is available.", false, false]], [["The PM, immediately, under two rows at once: scope grown beyond what was sold, and a date that cannot be met with the assigned team.", false, false]], [["Answer the client after that, with options rather than agreement.", false, false]], [["The end-of-day record carries the request itself, the impact estimate, and the fact that it is with the PM.", false, false]]]}]}, {"label": "Wrong turns", "blocks": [{"t": "p", "segs": [["Agreeing to the date on the spot, or forwarding the email to the team on a Friday evening and letting them work it out.", false, false]]}]}]}], "group": "", "title": "A request at the end of the week", "kicker": "Situation 10", "meta": [], "num": 10}, {"id": "s13", "blocks": [{"t": "p", "segs": [["What have you run into over the last month that this workflow does not cover? Propose one addition and say which phase it would belong to.", false, false]]}, {"t": "p", "segs": [["What to look for: a candidate who names something the workflow genuinely does not cover, rather than repeating a phase back at you. A good proposal here is worth carrying into the next revision of the document — note it and pass it on.", false, false]]}], "group": "", "title": "Not Scored", "kicker": "BONUS", "meta": ["Discuss, do not mark", "Owner: Mentor"]}, {"id": "s14", "blocks": [{"t": "fields", "items": [{"id": "mentor-280", "label": "Answers complete out of ten"}, {"id": "mentor-281", "label": "Reviewed with candidate on"}]}], "group": "", "title": "Outcome", "kicker": "", "meta": []}], "closing": "Work through every incomplete answer with the candidate before Phase 2 starts."}};

const blank = () => ({role:"candidate",ui:{theme:"dark",collapsed:false},profile:{name:"Catalin Laudat",start:today(),mentor:""},
  sign:{},evidence:{},qc:{},drill:{},form:{},decisions:[],changes:[],answers:{},marks:{},final:{},read:{},inp:{},src:{},comp:{},gap:{},elem:{},wrong:{},seeded:false});
function sample(){

  s.drill={i:6,r:{0:0,1:1,2:2,3:3,4:1,5:3}};
  const fa={f1:["Yes","Spec 26 05 33 §3.1","Yes"],f2:["Yes","Spec 26 05 33 §3.1","Yes"],f3:["Yes","BEP §4.2","Not checked"],f4:["Yes","Spec 26 05 33 §3.4","No"],
    f6:["Power & lighting branches","Spec 26 05 33 §3.2","Yes"],f7:["MV feeders, telecom feeders","E-501","Yes"],f10:["12\"","RFI-014","No"],f11:["Yes","Spec 27 05 28","Yes"],
    f13:["Yes","Spec 26 05 33 §2.1","Yes"],f14:["No","Spec 28 05 13","Not checked"],f16:["15°, 22.5°, 45°, 90° (45° preferred)","Client email 12 Sep","Yes"],f20:["360°","Spec 26 05 33 §3.6","Yes"],f24:["Yes","E-501 note 4","Yes"]};
  Object.entries(fa).forEach(([k,[a,src,c]])=>s.form[k]={ans:a,src,comp:c});
  ["f5","f9","f12","f27"].forEach(k=>s.form[k]={...(s.form[k]||{}),gap:true});
  s.decisions=[
    {date:daysAgo(9),q:"Hanger spacing on L2 corridor trapeze racks",c:"Decide",r:"Inside standards form, precedent on L1"},
    {date:daysAgo(8),q:"Redline routes power through IDF 2.14",c:"Ask",r:"Contradicts standards form 1.3 — client RFI"},
    {date:daysAgo(6),q:"Use LB bodies at wall penetrations",c:"Decide",r:"All conduit bodies permitted, reversible"},
    {date:daysAgo(5),q:"Feeder drop into mech riser zone",c:"Ask",r:"Affects another trade's space — RFI, copy GC"},
    {date:daysAgo(3),q:"Junction box above hard ceiling in lobby",c:"Ask",r:"Access issue, design intent"},
    {date:daysAgo(1),q:"Stub-up offset 2\" at Gridline C",c:"Decide",r:"Within tolerance, before pour, reversible"}];
  s.changes=[
    {date:daysAgo(40),q:"Added Level 4 lighting branches",r:"Level 4 not in contracted areas",h:"32",c:"With PM"},
    {date:daysAgo(22),q:"Third coordination round on Area B",r:"Contract allows two rounds",h:"18",c:"Priced"},
    {date:daysAgo(4),q:"Spool data export for prefab shop",r:"Not in deliverable list",h:"12",c:"Flagged"}];
  s.answers={1:["I send it back and ask him to restate it: what he needs, what he tried, what didn't work. I don't open the model and fix it for him.","No — a screenshot is not a structured question."],

    ${order.map(box).join("")}</svg>`;
}
const ring = (pct, col="var(--green)", size=120, label="") => { const r=48, L=2*Math.PI*r; return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="${Math.round(pct*100)}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--grey-soft)" stroke-width="12"/><circle class="ring-p" style="--a:${pct*L}" cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${pct*L} ${L}" transform="rotate(-90 60 60)"/><text class="ring-txt" x="60" y="${label?58:66}" text-anchor="middle" style="font:700 24px var(--font);fill:var(--text)">${Math.round(pct*100)}%</text>${label?`<text x="60" y="78" text-anchor="middle" style="font:500 11px var(--font);fill:var(--muted)">${label}</text>`:""}</svg>`; };

V.drill = () => {
  const D=COURSE.drill, st=S.drill, r=st.r||{}, i=Math.min(st.i||0,D.length);
  const dots = `<div class="dots">${D.map((d,k)=>`<span class="${r[k]==null?(k===i?"cur":""):r[k]===d.a?"ok":"no"}">${k+1}</span>`).join("")}</div>`;
  if (i>=D.length){
    const score=D.filter((d,k)=>r[k]===d.a).length;
    const byRoute=COURSE.routes.map((rt,k)=>({rt,k,tot:D.filter(d=>d.a===k).length,ok:D.filter((d,j)=>d.a===k&&r[j]===k).length}));
    return `<div class="ph"><div><h1>Escalation drill</h1><div class="sub">Practice only — not part of the sign-off</div></div></div>
    <div class="grid g-wide"><div class="card" style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">${ring(score/D.length, score>=8?"var(--green)":"var(--amber)",150,`${score} of ${D.length}`)}
      <div style="flex:1;min-width:220px"><h2>${score>=8?"Routing is solid.":"Worth another pass."}</h2><p class="muted" style="margin-top:6px">Routing and timing are what the Phase 1 checkpoint marks hardest.</p>${dots}<div class="frow mt"><button class="btn" id="drillAgain" style="flex:0 0 auto">Run it again</button><a class="btn out" style="flex:0 0 auto" href="#/doc/workflow">Review the workflow</a></div></div></div>
      <div class="card"><div class="card-h"><h2>By route</h2></div>${byRoute.map(b=>`<div style="margin-bottom:14px"><div class="frow" style="justify-content:space-between;margin-bottom:6px"><span style="flex:0 0 auto"><span class="chip ${ROUTE_CLS[b.k]}" style="border-color:transparent">${esc(b.rt)}</span></span><b class="small" style="flex:0 0 auto">${b.ok}/${b.tot}</b></div><div class="pbar"><i style="width:${b.tot?b.ok/b.tot*100:0}%;background:${ROUTE_COL[b.k]}"></i></div></div>`).join("")}</div></div>`;
  }
  const d=D[i], ans=r[i], done=ans!=null, row=COURSE.escalation[d.row];

  else rows=b.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>{

  if(v==="doc"&&DOCS[a]){ const own=NAV_SRC.el&&NAV_SRC.el.closest&&NAV_SRC.el.closest(".dsec"); let id=own&&own.isConnected?own.id.slice(4):null; if(!id) $$(".dsec").forEach(s=>{ if(s.getBoundingClientRect().top<160) id=s.id.slice(4); }); const s=DOCS[a].sections.find(x=>x.id===id); return s?s.title:""; }
  return ""; }
function snapshot(h,view,arg){ return {h,view,arg,tab:compTab,y:window.scrollY,label:retLabel(view,arg),sub:retSub(view,arg)}; }
function pushBack(e){ const t=BACK[BACK.length-1]; if(t&&t.h===e.h&&Math.abs(t.y-e.y)<40) return; BACK.push(e); if(BACK.length>20) BACK.shift(); }
const backBar = () => { const e=BACK[BACK.length-1]; return e?`<button class="retbar" data-back aria-label="Back to ${esc(e.label)}${e.sub?", "+esc(e.sub):""}"><span class="rb-ic">${ic("chev","width:16px;height:16px")}</span><span class="rb-t"><small>Back to</small>${esc(e.label)}</span>${e.sub?`<span class="chip">${esc(e.sub)}</span>`:""}</button>`:""; };
function goBack(){ const e=BACK[BACK.length-1]; if(!e) return; const {view,arg}=parse();
  if (e.view===view && e.arg===arg){ BACK.pop(); if(view==="c") compTab=e.tab; render(true); window.scrollTo({top:e.y,behavior:RM?"auto":"smooth"}); return; }
  if ((location.hash||"#/")===e.h) return; location.hash=e.h; }
window.addEventListener("hashchange",()=>{ loadStart(); const {view,arg}=parse(); const h=location.hash||"#/", kind=navKindNow(); NAV_SRC.k=null;
  const changed = view!==lastView||arg!==lastArg, top=BACK[BACK.length-1]; let back=null;
  if (kind==="top") BACK=[];
  else if (top && top.h===h) back=BACK.pop();
  else if (changed && kind==="content") pushBack(snapshot(lastHash,lastView,lastArg));
  lastHash=h; if(view==="c" && changed) compTab=back&&back.view==="c"?back.tab:"overview"; const same=!changed; lastView=view; lastArg=arg;
  restoring=!!back; render(same); restoring=false; if(!same){ window.scrollTo(0,back?back.y:0); $("#main").focus({preventScroll:true}); } closeSide(); });

const tip=$("#tip");
document.addEventListener("mouseover",e=>{ const t=e.target.closest&&e.target.closest("[data-tip]"); if(!t){ tip.hidden=true; return; } tip.innerHTML=t.dataset.tip; tip.hidden=false; });
document.addEventListener("mousemove",e=>{ if(tip.hidden) return; const w=tip.offsetWidth; tip.style.left=Math.min(window.innerWidth-w-10,e.clientX+14)+"px"; tip.style.top=(e.clientY+16)+"px"; });

document.addEventListener("click",e=>{
  const t=e.target, cl=s=>t.closest(s);
  const menu=$("#meMenu");
  if (cl("#meBtn")){ const o=menu.hidden; renderMenu(); menu.hidden=!o; $("#meBtn").setAttribute("aria-expanded",String(o)); return; }
  if (!cl("#meMenu")) { menu.hidden=true; $("#meBtn").setAttribute("aria-expanded","false"); }
  const rb=cl("[data-role]"); if (rb){ S.role=rb.dataset.role; save(); menu.hidden=true; render(true); toast(`Viewing as ${S.role}`); return; }
  const act=cl("[data-act]"); if (act){ menu.hidden=true;
    if (act.dataset.act==="sample"){ const th=S.ui.theme, role=S.role; SNAP=null; S=sample(); S.ui.theme=th; S.ui.welcomed=true; S.role=role; save(); render(true); toast("Sample progress loaded"); }
    else if (confirm("Clear all demo progress in this browser?")){ const th=S.ui.theme; SNAP=null; S=blank(); S.ui.theme=th; S.ui.welcomed=true; S.seeded=true; save(); render(true); toast("Started empty"); }
    return; }
  if (cl("#themeBtn")){ themeSwitch(e); return; }
  if (cl("#bellBtn")){ location.hash="#/"; setTimeout(()=>{ const c=[...$$(".card-h h2")].find(h=>h.textContent==="Needs attention"); c&&c.scrollIntoView({behavior:"smooth",block:"center"}); },50); return; }
  if (cl("#collapseBtn")){ S.ui.collapsed=!S.ui.collapsed; save(); renderChrome(); return; }
  if (cl("#menuBtn")){ const s=$("#side"), o=!s.classList.contains("open"); s.classList.toggle("open",o); $("#menuBtn").setAttribute("aria-expanded",String(o)); return; }
  if (t.closest(".side a")) closeSide();
  if (cl("[data-back]")){ goBack(); return; }
  const go=cl("[data-go]"); if (go){ location.hash=go.dataset.go; return; }
  const tb=cl("[data-tab]"); if (tb){ compTab=tb.dataset.tab; render(true); return; }
  const sl=cl("[data-setlvl]"); if (sl){ const id=parse().arg, n=+sl.dataset.setlvl, s=S.sign[id]||{}; S.sign[id]={...s,level:lvl(id)===n?n-1||"":n,mentor:s.mentor||S.profile.mentor||"",date:s.date||today()}; save(); render(true); toast(S.sign[id].level?`Level set to L${S.sign[id].level}`:"Level cleared"); return; }
  if (t.id==="evSave"){ const id=parse().arg; S.evidence[id]=$("#ev").value.trim(); save(); render(true); toast("Evidence link saved"); return; }
  if (t.id==="signSave"){ const id=parse().arg, s=S.sign[id]||{}; S.sign[id]={...s,mentor:$("#mname").value.trim(),date:$("#mdate").value,note:$("#mnote").value.trim()}; save(); render(true); toast("Sign-off saved"); return; }
  const tg=cl(".toggle button"); if (tg){ $$("button",tg.parentNode).forEach(b=>b.setAttribute("aria-pressed",String(b===tg))); return; }
  if (cl("[data-qc-check]")){ const qc=cl(".qc"), items=$$(".qc-item",qc), msg=$("[data-qc-msg]",qc);
    if (items.some(it=>!$(".toggle button[aria-pressed='true']",it))){ msg.textContent="Sort every statement first."; return; }
    let right=0; items.forEach(it=>{ const ok=$(".toggle button[aria-pressed='true']",it).dataset.v===it.dataset.k; if(ok) right++; it.classList.toggle("right",ok); it.classList.toggle("wrong",!ok); const w=$(".why",it); w.hidden=false; w.textContent=it.dataset.k==="g"?"From “What good looks like”.":"From “Common failures”."; });
    S.qc[qc.dataset.id]=right; save(); renderChrome(); msg.textContent=`Score: ${right}/${items.length}`; toast(`Quick check: ${right}/${items.length}`); return; }
  const fp=cl("[data-filter]"); if (fp){ mapFilter=fp.dataset.filter; render(true); return; }
  const ph=cl("[data-ph]"); if (ph){ wfPhase=+ph.dataset.ph; render(true); return; }
  const rt=cl("[data-route]"); if (rt){ const i=S.drill.i||0; S.drill.r=S.drill.r||{}; S.drill.r[i]=+rt.dataset.route; save(); render(true); return; }
  if (t.closest("#drillNext")){ S.drill.i=(S.drill.i||0)+1; save(); render(true); return; }
  if (t.closest("#drillAgain")){ S.drill={}; save(); render(true); return; }
  const ac=cl("[data-acc]"); if (ac){ const k=ac.dataset.acc; formOpen[k]=!formOpen[k]; ac.parentNode.classList.toggle("open",!!formOpen[k]); ac.setAttribute("aria-expanded",String(!!formOpen[k])); return; }
  if (t.closest("#expandAll")){ COURSE.form.forEach((_,i)=>formOpen[i]=true); render(true); return; }
  if (t.closest("#collapseAll")){ formOpen={}; render(true); return; }
  const gb=cl("[data-gap]"); if (gb){ const id=gb.dataset.gap; S.gap[id]=!S.gap[id]; save(); render(true); toast(S.gap[id]?"Added to questions for the PM":"Removed from questions for the PM"); return; }
  const sh=cl("[data-sec]"); if (sh){ const [k,s]=sh.dataset.sec.split(":"); docOpen[k] ||= new Set(); const el=sh.closest(".dsec"), o=!el.classList.contains("open"); o?docOpen[k].add(s):docOpen[k].delete(s); el.classList.toggle("open",o); sh.setAttribute("aria-expanded",String(o)); const bd=el.querySelector(".dsec-b"); o?bd.removeAttribute("inert"):bd.setAttribute("inert",""); return; }
  const jp=cl("[data-jump]"); if (jp){ const [k,s]=jp.dataset.jump.split(":"); jumpTo(k,s); return; }
  const rd=cl("[data-read]"); if (rd){ const [k,s]=rd.dataset.read.split(":"); S.read[k] ||= {}; S.read[k][s]=!S.read[k][s]; save(); render(true); if(S.read[k][s]) toast(docPct(k)===1?"Document complete":"Marked as read"); return; }
  const nx=cl("[data-next]"); if (nx){ const [k,s,n]=nx.dataset.next.split(":"); S.read[k] ||= {}; S.read[k][s]=true; save(); docOpen[k].delete(s); jumpTo(k,n); return; }
  const ex=cl("[data-expand]"); if (ex){ const k=ex.dataset.expand; docOpen[k]=new Set(DOCS[k].sections.map(s=>s.id)); render(true); return; }
  const co=cl("[data-collapse]"); if (co){ docOpen[co.dataset.collapse]=new Set(); render(true); return; }
  if (cl("[data-wfeng]")){ wfEng=!wfEng; render(true); return; }
  if (cl("[data-w1]")){ S.ui.w1 = S.ui.w1===false; save(); render(true); return; }
  const yb=cl("[data-yn]"); if (yb){ const id=yb.dataset.yn; S.inp[id] = S.inp[id]===yb.dataset.v ? "" : yb.dataset.v; save(); render(true); return; }
  const wr=cl("[data-wrong]"); if (wr){ const n=wr.dataset.wrong; S.wrong[n]=!S.wrong[n]; if(S.wrong[n]) (S.marks[n] ||= {}).ok=false; save(); render(true); return; }
  const spc=cl("[data-spc]"); if (spc){ const [a,b]=spc.dataset.spc.split(":"); spA=+a; spB=+b; render(true); return; }
  if (t.closest("#copyGaps")){ const txt=gapsList().map((g,i)=>`${i+1}. ${g.sec} — ${g.q}`).join("\n"); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied to clipboard")).catch(()=>toast("Copy is blocked here — select the list instead")); return; }
  const sc=cl("[data-scn]"); if (sc){ cpSel=sc.dataset.scn==="bonus"?"bonus":+sc.dataset.scn; render(true); if(window.innerWidth<1100) $(".md > .card:last-child").scrollIntoView({block:"start"}); return; }
  const add=cl("[data-add]"); if (add){ S[add.dataset.add].push({date:today(),q:"",c:add.dataset.add==="decisions"?"Decide":"Flagged",r:"",h:""}); save(); render(true); const ins=$$(`[data-log="${add.dataset.add}"][data-k="q"]`); ins.length&&ins[ins.length-1].focus(); return; }
  const del=cl("[data-del]"); if (del){ S[del.dataset.del].splice(+del.dataset.i,1); save(); render(true); toast("Entry removed"); return; }
});
document.addEventListener("keydown",e=>{
  const go=e.target.closest&&e.target.closest("[data-go]");
  if (go && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); location.hash=go.dataset.go; }
  const jp=e.target.closest&&e.target.closest("[data-jump]"); if (jp && jp.tagName!=="BUTTON" && jp.tagName!=="A" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); const [k,s]=jp.dataset.jump.split(":"); jumpTo(k,s); }
  if (e.key==="Escape"){ $("#meMenu").hidden=true; closeSide(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if (t.dataset.chk){ S.inp[t.dataset.chk]=t.checked; save(); render(true); return; }
  if (t.dataset.comp){ S.comp[t.dataset.comp]=t.value; save(); render(true); return; }
  if (t.dataset.elem){ const [n,i]=t.dataset.elem.split(":"); (S.elem[n] ||= {})[i]=t.checked; save(); render(true); return; }
  if (t.dataset.sp){ t.dataset.sp==="A"?spA=+t.value:spB=+t.value; render(true); return; }
  if (t.dataset.inp && (t.tagName==="SELECT"||t.type==="date")){ S.inp[t.dataset.inp]=t.value; save(); refreshLight(); return; }
  if (t.dataset.log){ S[t.dataset.log][+t.dataset.i][t.dataset.k]=t.value; save(); if(t.dataset.k==="h"||t.dataset.k==="c") render(true); return; }
  if (t.dataset.rec){ const s=S.sign[t.dataset.rec]||{}; S.sign[t.dataset.rec]={...s,level:t.value?+t.value:"",mentor:s.mentor||S.profile.mentor||"",date:s.date||(t.value?today():"")}; save(); render(true); toast("Level updated"); return; }
  if (t.dataset.mark){ (S.marks[t.dataset.mark] ||= {}).ok=t.checked; save(); render(true); return; }
  if (t.dataset.final){ S.final[t.dataset.final]=t.checked; save(); render(true); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if (t.id==="mapSearch"){ mapQuery=t.value; const pos=t.selectionStart; render(true); const n=$("#mapSearch"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} return; }
  if (t.id==="docSearch"){ docQ[parse().arg]=t.value; render(true); const n=$("#docSearch"); if(n){ n.focus(); const L=n.value.length; try{n.setSelectionRange(L,L);}catch(_){} } return; }
  if (t.dataset.inp){ S.inp[t.dataset.inp]=t.value; save(); clearTimeout(window._rl); window._rl=setTimeout(refreshLight,250); return; }
  if (t.dataset.src){ S.src[t.dataset.src]=t.value; save(); return; }
  if (t.dataset.ans){ (S.answers[t.dataset.ans] ||= [])[+t.dataset.k]=t.value; save();
    clearTimeout(window._rl); window._rl=setTimeout(refreshLight,250); return; }
  if (t.dataset.mnote){ (S.marks[t.dataset.mnote] ||= {}).note=t.value; save(); return; }
});
function closeSide(){ const s=$("#side"); if(s.classList.contains("open")){ s.classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); } }

save(); render(false);
</script>

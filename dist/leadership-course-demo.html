<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Leader Raising Program · Eracore Learning Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --side:#FFFFFF; --panel:#FFFFFF; --panel-2:#F6F8FB; --border:#E1E6EE; --border-2:#EDF0F5;
  --text:#141A24; --muted:#5E6878; --faint:#8A93A3;
  --blue:#3E73E0; --blue-strong:#3E73E0; --blue-soft:rgba(62,115,224,.12); --on-blue:#FFFFFF;
  --green:#22A06B; --green-soft:rgba(34,160,107,.13);
  --amber:#D98A14; --amber-soft:rgba(217,138,20,.14);
  --red:#D64545; --red-soft:rgba(214,69,69,.12);
  --grey:#9AA3B2; --grey-soft:rgba(154,163,178,.18);
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --side:#11161F; --panel:#161B25; --panel-2:#1B212D; --border:#252C39; --border-2:#1F2531;
    --text:#E7EAF0; --muted:#9AA3B2; --faint:#6E7788;
    --blue:#7AA3F7; --blue-strong:#5B8DEF; --blue-soft:rgba(110,156,246,.16); --on-blue:#0B1220;
    --green:#4CC38A; --green-soft:rgba(76,195,138,.15);
    --amber:#F0A63A; --amber-soft:rgba(240,166,58,.15);
    --red:#EF6B6B; --red-soft:rgba(239,107,107,.14);
    --grey:#6B7385; --grey-soft:rgba(120,130,150,.22);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --side:#11161F; --panel:#161B25; --panel-2:#1B212D; --border:#252C39; --border-2:#1F2531;
  --text:#E7EAF0; --muted:#9AA3B2; --faint:#6E7788;
  --blue:#7AA3F7; --blue-strong:#5B8DEF; --blue-soft:rgba(110,156,246,.16); --on-blue:#0B1220;
  --green:#4CC38A; --green-soft:rgba(76,195,138,.15);
  --amber:#F0A63A; --amber-soft:rgba(240,166,58,.15);
  --red:#EF6B6B; --red-soft:rgba(239,107,107,.14);
  --grey:#6B7385; --grey-soft:rgba(120,130,150,.22);
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.6rem;line-height:1.25}
h2{font-size:1.06rem}
h3{font-size:.98rem}
p{margin:0 0 .7em}
svg{display:block}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--side);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.08em;font-size:.95rem}
.logo .sep{width:1px;height:20px;background:var(--border)}
.logo .app{letter-spacing:0;font-weight:600}
.top .grow{flex:1}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--panel-2);color:var(--text)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--side)}
.me{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:10px}
.me:hover{background:var(--panel-2)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue-strong);color:#fff;font-weight:600;font-size:.85rem;flex:none}
.avatar.sm{width:34px;height:34px;background:var(--blue-soft);color:var(--blue);font-size:.8rem}
.me .name{font-weight:600}
.badge{font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;border:1px solid var(--blue);color:var(--blue);background:var(--blue-soft)}
.badge.mentor{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.menu{position:absolute;right:16px;top:60px;width:250px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel-2)}
.menu .lbl{font-size:.75rem;color:var(--faint);padding:8px 10px 4px}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .on{color:var(--blue);font-weight:600}

/* sidebar */
.layout{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 64px)}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow:auto;background:var(--side);border-right:1px solid var(--border);padding:18px 12px 24px}
.nav{list-style:none;margin:0;padding:0}
.nav .grp{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:16px 12px 6px;border-top:1px solid var(--border);margin-top:12px}
.nav .grp.first{border-top:0;margin-top:0;padding-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--text)}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nav .cnt{margin-left:auto;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);padding:0 8px;border-radius:999px}
.nav .cnt.warn{color:var(--amber);border-color:transparent;background:var(--amber-soft)}
.collapse{position:fixed;left:259px;top:calc(50% + 32px);width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;cursor:pointer;z-index:40;color:var(--muted)}
.collapsed .layout{grid-template-columns:72px 1fr}
.collapsed .nav .txt,.collapsed .nav .cnt,.collapsed .nav .grp span{display:none}
.collapsed .nav .grp{padding:10px 0 4px;margin-top:8px}
.collapsed .nav a{justify-content:center;padding:10px 0}
.collapsed .collapse{left:59px;transform:rotate(180deg)}

main{padding:28px 32px 64px;min-width:0}
.page{max-width:1500px;margin:0 auto}

/* page header */
.ph{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ph .sub{color:var(--muted);margin-top:4px}
.ph .acts{display:flex;gap:10px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:.85rem;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb a:hover{color:var(--blue)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--blue-strong);background:var(--blue-strong);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.out{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn.out:hover{background:var(--blue-soft)}
.btn.quiet{background:var(--panel-2);border-color:var(--border);color:var(--text)}
.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--blue);font-weight:600;font-size:.9rem;cursor:pointer;background:none;border:0;padding:0}

/* cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.count{min-width:30px;height:24px;padding:0 9px;border-radius:999px;background:var(--amber);color:#1A1205;font-weight:700;font-size:.82rem;display:inline-grid;place-items:center}
.count.blue{background:var(--blue-strong);color:#fff}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.mt{margin-top:16px}

.kpi{display:flex;align-items:center;gap:14px;padding:16px 18px}
.kpi .tile{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .tile .ico{width:22px;height:22px}
.t-blue{background:var(--blue-soft);color:var(--blue)} .t-green{background:var(--green-soft);color:var(--green)}
.t-amber{background:var(--amber-soft);color:var(--amber)} .t-red{background:var(--red-soft);color:var(--red)}
.kpi .k{font-weight:600}
.kpi .s{color:var(--muted);font-size:.84rem}
.kpi .v{margin-left:auto;font-size:1.85rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.kpi:hover{border-color:var(--blue)}

.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:.85rem;font-weight:500;margin-bottom:6px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:7px;vertical-align:middle}

/* rows/lists */
.rowi{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--border-2)}
.rowi:first-child{border-top:0}
.rowi .main{min-width:0;flex:1}
.rowi .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .s{color:var(--muted);font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.progress{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}

.jump{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.jump a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;font-weight:500}
.jump a:hover{background:var(--panel-2);color:var(--blue)}

/* charts */
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:500 11px var(--font)}
.chart .gridl{stroke:var(--border);stroke-width:1}
.chart .hit{cursor:pointer}
.chart .hit:hover .bar,.chart .hit:focus .bar{filter:brightness(1.2)}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.82rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:280px}
.tip b{display:block}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-leg{display:grid;gap:10px;min-width:150px}
.donut-leg div{display:flex;align-items:center;gap:10px}
.donut-leg i{width:10px;height:10px;border-radius:3px}
.donut-leg b{margin-left:auto}
.seg{cursor:pointer;transition:stroke-width .15s}
.seg:hover{stroke-width:18}

/* route map */
.route .conduit{fill:none;stroke:var(--grey);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.route .conduit-in{fill:none;stroke:var(--panel);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.route .live{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.route .box{cursor:pointer}
.route .box rect{fill:var(--panel);stroke:var(--grey);stroke-width:2}
.route .box text{font:700 14px var(--font);fill:var(--text);text-anchor:middle;dominant-baseline:central}
.route .box.progress rect{fill:var(--blue-soft);stroke:var(--blue)}
.route .box.done rect{fill:var(--green);stroke:var(--green)}
.route .box.done text{fill:#0B1A12}
.route .box:hover rect,.route .box:focus rect{stroke-width:3.5}
.route .box:focus{outline:none}
.route .wk{font:600 12px var(--font);fill:var(--muted);text-anchor:middle}
.route .pull rect{fill:var(--blue-strong)}
.route .pull text{fill:#fff;font:700 12px var(--font);text-anchor:middle;dominant-baseline:central}
.route .pull{cursor:pointer}

/* filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.pills{display:inline-flex;gap:4px;padding:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap}
.pills button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:0 12px;min-width:240px;color:var(--muted)}
.search input{border:0;background:transparent;padding:8px 0;outline:none;width:100%;color:var(--text)}

.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);transition:border-color .15s}
.ccard:hover{border-color:var(--blue)}
.ccard .top-r{display:flex;align-items:center;gap:10px}
.ccard .n{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--panel-2);border:1px solid var(--border)}
.ccard.done .n{background:var(--green);color:#0B1A12;border-color:transparent}
.ccard.progress .n{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.ccard .t{font-weight:600;line-height:1.35}
.ccard .m{color:var(--muted);font-size:.84rem;margin-top:auto}
.lvlbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lvlbar i{height:5px;border-radius:3px;background:var(--grey-soft)}
.lvlbar i.on{background:var(--blue)}
.done .lvlbar i.on,.lvlbar.done i.on{background:var(--green)}

/* competency page */
.hero{display:flex;gap:18px;align-items:flex-start}
.hero .n{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:1.8rem;font-weight:700;background:var(--blue-soft);color:var(--blue);flex:none}
.hero.done .n{background:var(--green);color:#0B1A12}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:4px;position:relative}
.stepper .st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;padding:0 6px}
.stepper .st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--border);z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.on::before{background:var(--green)}
.stepper .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--panel-2);border:2px solid var(--border);position:relative;z-index:1}
.stepper .st.on .c{background:var(--green);border-color:var(--green);color:#0B1A12}
.stepper .st.target .c{box-shadow:0 0 0 4px var(--green-soft)}
.stepper .nm{font-weight:600;font-size:.85rem}
.stepper .tx{color:var(--muted);font-size:.78rem;line-height:1.35}
.stepper button.c{cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:22px 0 18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border-2)}
.lst li:first-child{border-top:0}
.lst .mk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px}
.lst .mk .ico{width:14px;height:14px;stroke-width:2.6}
.callout{border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 10px 10px 0;padding:14px 16px}
.callout.green{border-color:var(--green);background:var(--green-soft)}
.callout.amber{border-color:var(--amber);background:var(--amber-soft)}
.lede{color:var(--muted);font-size:1rem;max-width:78ch}

/* forms */
label.f{display:block;font-size:.8rem;color:var(--muted);margin:0 0 5px;font-weight:500}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.frow > *{flex:1 1 170px}

/* quick check */
.qc-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel-2)}
.qc-item.right{border-color:var(--green);background:var(--green-soft)}
.qc-item.wrong{border-color:var(--red);background:var(--red-soft)}
.qc-item .why{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.toggle button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.toggle button+button{border-left:1px solid var(--border)}
.toggle button[aria-pressed="true"][data-v="g"]{background:var(--green);color:#0B1A12}
.toggle button[aria-pressed="true"][data-v="f"]{background:var(--red);color:#fff}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(8,1fr);position:relative;margin:6px 0 4px}
.flow::before{content:"";position:absolute;left:6%;right:6%;top:23px;height:3px;background:var(--border)}
.flow button{position:relative;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;text-align:center}
.flow .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.05rem;background:var(--panel-2);border:2px solid var(--border);color:var(--muted);transition:transform .15s}
.flow .p{font-weight:600;font-size:.86rem;line-height:1.25}
.flow .w{font-size:.75rem;color:var(--muted);line-height:1.3}
.flow button:hover .c{border-color:var(--blue);color:var(--blue)}
.flow button[aria-pressed="true"] .c{background:var(--blue-strong);border-color:var(--blue-strong);color:#fff;transform:scale(1.08)}
.flow button.trig .c{border-style:dashed}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rule{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px}
.rule h3{font-size:.9rem;margin-bottom:8px}
.rule ul{margin:0;padding-left:18px;color:var(--muted)}
.rule li{margin:3px 0}
.rule li::marker{color:var(--blue)}
table{border-collapse:collapse;width:100%}
.tbl-wrap{overflow-x:auto}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
tbody tr:hover{background:var(--panel-2)}
.r0{color:var(--green);background:var(--green-soft)} .r1{color:var(--blue);background:var(--blue-soft)}
.r2{color:#B38CF5;background:rgba(179,140,245,.15)} .r3{color:var(--amber);background:var(--amber-soft)}

/* drill */
.drill-q{font-size:1.12rem;font-weight:500;line-height:1.5;margin:8px 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--border);background:var(--panel-2);padding:14px;border-radius:10px;cursor:pointer;font-weight:600}

.choices button .sw{width:12px;height:12px;border-radius:4px;flex:none}
.choices button.correct{border-color:var(--green);background:var(--green-soft)}
.choices button.incorrect{border-color:var(--red);background:var(--red-soft)}
.choices button:disabled{cursor:default}
.pbar{height:6px;border-radius:3px;background:var(--grey-soft);overflow:hidden}

.dots{display:flex;gap:6px;flex-wrap:wrap}

.dots span.no{background:var(--red-soft);color:var(--red);border-color:transparent}
.dots span.cur{border-color:var(--blue);color:var(--blue)}

/* standards form */
.acc{border:1px solid var(--border);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}

.acc > button .t{font-weight:600;flex:1}

.acc.open .body{display:block}
.fhead,.fitem{display:grid;grid-template-columns:minmax(200px,1.5fr) 1fr 1fr 130px 70px;gap:10px;align-items:center}

.gapbtn[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.sticky{position:sticky;top:88px}

/* checkpoint */
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.slist{padding:8px}
.slist button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer;text-align:left}
.slist button:hover{background:var(--panel-2)}
.slist button[aria-current="true"]{background:var(--blue-soft)}
.slist .n{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--panel-2);border:1px solid var(--border);flex:none}
.slist .n.full{background:var(--green);color:#0B1A12;border-color:transparent}
.slist .n.part{background:var(--amber-soft);color:var(--amber);border-color:transparent}

/* toast */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;padding:10px 16px;font-weight:500;z-index:120;transition:all .2s;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

pre{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;max-height:420px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

mark{background:rgba(240,166,58,.4);color:inherit;border-radius:3px;padding:0 1px}

/* ================= FX LAYER ================= */
:root{--glow-blue:rgba(91,141,239,.55);--glow-purple:rgba(168,85,247,.45);--glow-green:rgba(76,195,138,.6);--grad:linear-gradient(135deg,#22D3EE,#5B8DEF 45%,#A855F7);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(100px);opacity:.15;animation:drift 28s ease-in-out infinite alternate}
#aurora i:nth-child(1){background:#5B8DEF;top:-20vmax;left:12vw}
#aurora i:nth-child(2){background:#A855F7;bottom:-24vmax;right:-10vmax;animation-duration:34s;animation-delay:-9s}
#aurora i:nth-child(3){background:#22D3EE;top:32vh;left:-22vmax;animation-duration:40s;opacity:.08}
:root[data-theme="light"] #aurora i{opacity:.09}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,5vh) scale(1.12)}100%{transform:translate(-4vw,9vh) scale(.94)}}
.layout{position:relative;z-index:1}
.top{background:color-mix(in srgb,var(--side) 82%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.side{background:color-mix(in srgb,var(--side) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#loadbar{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;height:3px;width:0;z-index:70;background:var(--grad);box-shadow:0 0 14px var(--glow-blue),0 0 4px rgba(255,255,255,.4);opacity:0;transition:width .4s var(--ease),opacity .35s;border-radius:0 3px 3px 0}

#scrollbar{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;height:2px;z-index:69;background:var(--grad);transform-origin:left;transform:scaleX(var(--p,0));opacity:.75;pointer-events:none}
/* splash */

@keyframes load{to{width:100%}} @keyframes spin{to{transform:rotate(360deg)}} @keyframes breathe{50%{transform:scale(1.07)}}
/* entrances */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

@keyframes growY{from{transform:scaleY(0)}}
.anim-in .tl-bar{transform-box:fill-box;transform-origin:0 50%;animation:growX .9s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms + 250ms)}
@keyframes growX{from{transform:scaleX(0)}}
.anim-in .pbar>i{animation:fillW 1.2s var(--ease) backwards;animation-delay:.25s}
@keyframes fillW{from{width:0}}
.anim-in .ring-p{animation:ringIn 1.4s var(--ease) backwards;animation-delay:.15s}
@keyframes ringIn{from{stroke-dashoffset:var(--a)}}

.anim-in .route .live{stroke-dasharray:2600;animation:draw 2s var(--ease) backwards;animation-delay:.3s}
@keyframes draw{from{stroke-dashoffset:2600}}
.route .box{transition:transform .3s var(--spring);transform-box:fill-box;transform-origin:center}
.route .box:hover,.route .box:focus{transform:scale(1.2)}
.anim-in .route .box{animation:popIn .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*55ms + 250ms)}
.route .box.done rect{filter:drop-shadow(0 0 7px var(--glow-green))}
.route .pull{transition:transform .3s var(--spring);transform-box:fill-box;transform-origin:center}
.route .pull:hover{transform:scale(1.08)}
.route .pull rect{filter:drop-shadow(0 0 10px var(--glow-blue))}
.chart .hit .bar{transition:filter .2s}
.chart .hit:hover .bar{filter:brightness(1.25) drop-shadow(0 0 8px var(--glow-blue))}
/* cards: glow, spotlight, shine */
.card:not(.toc),.dsec,.ccard,.doctile{position:relative}
.card:not(.toc)::after,.dsec::after,.ccard::after,.doctile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),rgba(122,163,247,.11),transparent 45%);opacity:0;transition:opacity .35s;z-index:0}

.card,.dsec,.ccard,.doctile{transition:border-color .3s,box-shadow .35s,transform .35s var(--ease)}
.card:hover,.dsec:hover{border-color:color-mix(in srgb,var(--blue) 28%,var(--border))}
.kpi,.doctile,.ccard{overflow:hidden}
.kpi::before,.doctile::before,.ccard::before{content:"";position:absolute;top:0;left:-160%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg);pointer-events:none;transition:left .8s var(--ease);z-index:2}

.kpi:hover .tile,.doctile:hover .tile{transform:rotate(-8deg) scale(1.14);box-shadow:0 0 24px -4px currentColor}
.kpi .v{background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 65%,var(--blue)));-webkit-background-clip:text;background-clip:text;color:transparent}
.tilt{will-change:transform;transform-style:preserve-3d;transition:transform .45s var(--ease),box-shadow .35s,border-color .3s}
.tilt.tilting{transition:transform .09s linear,box-shadow .35s,border-color .3s}
.dsec.open{border-color:color-mix(in srgb,var(--blue) 35%,var(--border));box-shadow:0 20px 50px -30px var(--glow-blue)}
.dsec.isread{box-shadow:inset 3px 0 0 var(--green),0 0 0 transparent}
.dsec.open.isread{box-shadow:inset 3px 0 0 var(--green),0 20px 50px -30px var(--glow-green)}

.dsec-in{overflow:hidden;min-height:0}
.dsec-in > .dsec-f{margin-bottom:2px}
.dsec-h .chev{transition:transform .4s var(--spring)}
.dsec-h .kick{transition:box-shadow .3s}
.dsec.open .dsec-h .kick{box-shadow:0 0 16px -4px var(--glow-blue)}

.ph h1,.doctitle,.hero h1{background:linear-gradient(90deg,var(--text) 0%,var(--text) 38%,#7AA3F7 52%,#B794F6 62%,var(--text) 76%,var(--text) 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s ease-in-out infinite}

.btn:hover:not(:disabled){transform:translateY(-2px);filter:none}
.btn:active:not(:disabled){transform:translateY(0) scale(.96)}
.btn.out:hover:not(:disabled){box-shadow:0 0 0 3px var(--blue-soft),0 10px 24px -12px var(--glow-blue)}
.btn.quiet:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn::before{content:"";position:absolute;top:0;left:-130%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .6s var(--ease);pointer-events:none}

.link{transition:color .2s,text-shadow .3s}
.link:hover{text-shadow:0 0 14px var(--glow-blue)}
/* nav */
.nav a{position:relative;transition:background .25s,color .2s,transform .3s var(--spring)}

#themeBtn:hover .ico{animation:spin 1.2s linear}
.dot{animation:pulseDot 2s infinite}

.menu{animation:menuIn .3s var(--spring);transform-origin:top right;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 50px -12px rgba(0,0,0,.5),0 0 40px -18px var(--glow-purple)}

.palbtn{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:color-mix(in srgb,var(--panel-2) 80%,transparent);color:var(--muted);cursor:pointer;min-width:250px;transition:border-color .25s,box-shadow .35s,transform .3s var(--spring);font-size:.9rem}

.palbtn kbd{margin-left:auto}
kbd{font:600 .72rem var(--font);padding:2px 6px;border-radius:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted)}
/* tooltip & toast */
.tip{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--panel) 86%,transparent);border-color:color-mix(in srgb,var(--blue) 35%,var(--border));box-shadow:0 14px 34px -10px rgba(0,0,0,.55),0 0 24px -10px var(--glow-blue);animation:tipIn .2s var(--ease)}
@keyframes tipIn{from{opacity:0;transform:translateY(4px) scale(.96)}}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px 14px;overflow:hidden;border-left:1px solid color-mix(in srgb,var(--green) 45%,var(--border));border:1px solid color-mix(in srgb,var(--green) 45%,var(--border));background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px -12px rgba(0,0,0,.5),0 0 34px -12px var(--glow-green);transform:translateX(-50%) translateY(30px) scale(.9);transition:transform .5s var(--spring),opacity .3s}
.toast.show{transform:translateX(-50%) translateY(0) scale(1)}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);flex:none;animation:popIn .5s var(--spring)}
.toast .ti .ico{width:15px;height:15px;stroke-width:2.6}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:var(--green);box-shadow:0 0 8px var(--glow-green);animation:tbar 2.2s linear forwards}

/* modal */
.overlay{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:rgba(5,8,14,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.overlay.show{opacity:1;visibility:visible}
.mbox,.pbox{position:relative;background:color-mix(in srgb,var(--panel) 94%,transparent);border-radius:20px;box-shadow:0 30px 90px -20px rgba(0,0,0,.65),0 0 70px -24px var(--glow-purple);transform:translateY(26px) scale(.9);transition:transform .55s var(--spring);isolation:isolate}

.mbox{width:min(470px,100%);padding:32px 28px 24px;text-align:center;overflow:hidden}
.mbox::before,.pbox::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),#22D3EE,#5B8DEF,#A855F7,#22D3EE);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:angle 4s linear infinite;pointer-events:none}

.pbox{width:min(660px,100%);overflow:hidden}

input[type=checkbox]:checked{animation:popIn .3s var(--spring)}

a.chip:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px var(--glow-blue)}

.pbar>i{position:relative;overflow:hidden;box-shadow:0 0 10px -2px var(--glow-blue)}

@keyframes barShine{60%,100%{transform:translateX(100%)}}
.toc-i{transition:background .2s,transform .3s var(--spring)}

.rowi{transition:background .25s,transform .3s var(--ease);border-radius:10px}

.reqi.on{box-shadow:0 0 18px -10px var(--glow-green)}
.lvlcard:hover,.rule:hover,.subhead:hover{border-color:color-mix(in srgb,var(--blue) 50%,var(--border));box-shadow:0 14px 34px -18px var(--glow-blue)}

.spc-c:hover{transform:scale(1.18);position:relative;z-index:2;box-shadow:0 0 0 2px var(--blue),0 0 18px -2px var(--glow-blue);border-radius:6px}

mark{animation:popIn .35s var(--spring);box-shadow:0 0 12px -2px rgba(240,166,58,.7)}
.empty{animation:fadeUp .4s var(--ease)}

<script>
const COURSE = {
  id: "tlrp-electrical-bim",
  title: "Team Leader Raising Program",
  org: "Eracore Electrical BIM",
  summary: "Takes a strong electrical BIM engineer and builds the judgment of a team leader. Revit, Navisworks and Bluebeam skill is assumed. What is assessed is what you do when the client adds an area on a Thursday, when the team is heading into a weekend to hit a pour date, and when a package is one click from release with an error in it.",
  principle: "A competency is signed off when your mentor has seen you do it on a real project — not when you have read about it, and not when you sat in the room while someone else did it.",
  levels: [
    {code:"L1",name:"Observes",text:"Watches a senior lead do it and can explain afterwards what happened and why."},
    {code:"L2",name:"Does with review",text:"Does it themselves; the mentor checks before anything leaves the team."},
    {code:"L3",name:"Does independently",text:"Does it unsupervised. The target level for final sign-off."},
    {code:"L4",name:"Teaches others",text:"Coaches another engineer through it. Expected within six months of sign-off."}
  ],
  background: [
    "Nothing leaves your team without a signed check list, from the day the check list exists.",
    "Keep a written decision log: every question that comes up, classified decide or ask, with the reasoning.",
    "Sit in on every client meeting as a listener from Week 1. No speaking part until Phase 2."
  ],
  documents: {
    "Team Communication Workflow": "#/doc/workflow",
    "Project Technical Standards & Preferences Form": "#/doc/standards"
  },
  competencies: [{"id": 1, "title": "Knows the Project's Technical Standards and Where They Live", "purpose": "Every project carries a set of client-specific technical requirements — routing rules, fill, spacing, bend limits, sweep radii, below-grade materials, access and clearance. A lead who does not know them cannot check work against them, cannot brief the team on them, and cannot tell when the client is asking for something that contradicts them.", "uses": "Project Technical Standards & Preferences Form", "good": ["Can state the project's requirements from memory for the systems the team is currently working on", "Knows where each one is written — specification, BEP, contract drawings, an RFI answer — and can produce the source", "Knows which requirements differ from what Eracore does by default, and has told the team", "Treats an unanswered requirement as an RFI, not as a place to improvise"], "fail": ["Working to habit or to the last project's rules because nobody checked this one's", "Discovering a requirement only when the client returns the package with comments", "Knowing a rule personally but never passing it to the team"], "task": "Fill in the Project Technical Standards & Preferences Form for your current project, using the contract documents, the specification, the BEP and the drawings. Cite the source for every answer. Mark every item you could not find an answer for — that list is the set of open questions you take to your PM. Then mark which answers your current model actually complies with.", "signoff": "The completed form is reviewed by your mentor and the PM. Every answer traceable to a source, every gap listed rather than guessed at, and any non-compliance you found reported rather than quietly fixed.", "weekLabel": "Week 1", "theme": "The Standards You Work To", "phase": 1}, {"id": 2, "title": "Understands the Project Lifecycle", "purpose": "Your model is one step in a chain that ends with installed conduit and an energized building. A lead who cannot see the chain optimises the wrong thing and cannot explain to the team why a date matters.", "good": ["Understand the project phases, it’s sequence and what Eracore owes at each to the client. — understand the client requirements and whishes, BIM execution plan, sign-off and deadlines dates, installation and shop drawings sequence. Understand and follow the project required model LOD.", "Produces the detail appropriate to the phase, and does not detail hangers in an area still being coordinated", "Knows who consumes each deliverable next — the GC's VDC lead, the foreman laying out from the points, the shop building the spools — and what breaks for them when it is late or wrong", "Knows which decisions are still cheap and which are effectively permanent: once concrete is poured or gear is ordered, a modeling error becomes a field cost"], "fail": ["Detailing at shop-drawing level while the area is still in early coordination and the layout will change", "Not knowing the foreman is waiting on layout points, so a two-day slip in the export stops a crew", "Treating area sign-off as an administrative step rather than the moment risk transfers"], "task": "Collect the phases, dates and deliverables of your current project, or of another project your mentor assigns. Work from the documents you have, and go to your PM where the picture is incomplete or you can see gaps in it. Then build a Gantt table of the drawing deliverables in Excel, showing how the issues follow one another through the project. Where there is little firm information far out, cover at least the next two weeks properly.", "signoff": "The dates are correct and the table is properly built — it is possible to see from it how the deliverables move through the project.", "weekLabel": "Week 2", "theme": "The Project and the Check List", "phase": 1, "uses": null}, {"id": 3, "title": "Builds the Check List for the Package", "purpose": "The check list is the instrument that turns a standard into a verification. It is derived from the client's requirements, not invented — which is why it comes after the standards form and not before.", "uses": "Project Technical Standards & Preferences Form", "good": ["Derived from the project standards form and the Eracore modeling standards, not from personal habit", "Grouped by layer — model, coordination, electrical requirements, supports, field data, sheets, package, history", "Short enough to be used on every release and specific enough that two different people checking the same package reach the same result", "Names who checks, and states that the checker is not the author"], "fail": ["Unclear wide not specific items to check", "Checks the model but never the issued PDF, the sheets, the revision table or the file naming", "Previous round's client comments were closed but were not included/updated in checklist"], "task": "Build the check list for your package type: one page, grouped by layer. Every item has to come from a real requirement — the completed standards form, the project specification, client requirements that have already been stated and recorded, and the Eracore internal standards. Note the source next to each item.", "signoff": "Every item is correctly written out, traceable to one of those four sources, and relevant to this project. A second person checking the same package by this list reaches the same result.", "weekLabel": "Week 2", "theme": "The Project and the Check List", "phase": 1}, {"id": 4, "title": "Checks a Deliverable Properly", "purpose": "Checking is a layered procedure, not a look over the model. Each layer catches a class of error the others cannot, and knowing which errors are critical matters as much as finding them.", "good": ["Model — correct levels and worksets, elements hosted properly, no orphaned or duplicated conduit, sizes and types matching the redlines", "Coordination — current federated model, clash test rerun at the agreed tolerance, resolved clashes verified as actually resolved rather than hidden or filtered out", "Electrical — routing, fill, spacing, bend radius and cumulative bend limits, pull points, working clearance and dedicated equipment space at gear, bending space at terminations, all against the project standards form", "Supports — hangers and racks where required, spacing to standard, rod lengths and structural attachment achievable", "Field data — layout points exported, named and matching the model; spool and prefab data consistent with what was modeled", "Sheets — right view at the right scale, tags and dimensions complete, schedules current, revision clouds and revision table filled, title block and sheet numbering right", "Package — the exported PDF checked as a PDF and not on screen in Revit, file naming to the client's convention. Schedules should list exactly what is on the drawing and quantities should match between them.", "History — every comment from the client's previous markup closed or explicitly answered"], "fail": ["Checking the model and never opening the issued PDF", "The author checking their own work", "Clashes that are left hoping to be resolved by another trade without notify anyone about it", "Comments from the previous round silently ignored"], "task": "You are given an area or a set of drawings and are responsible for checking them. The drawings are checked and reissued by your team under your direction, as many times as you judge necessary. When you consider them ready, they go to the team lead. If the team lead finds no comments, the check counts as successful.", "signoff": "Five successful checks — five sets accepted by the team lead with no comments.", "weekLabel": "Week 3", "theme": "Does the Check List Actually Work", "phase": 1, "uses": null}, {"id": 5, "title": "Release Discipline — Checks Every Time", "purpose": "Teams do not fail because they cannot check. They fail because this one was small, this one was urgent, and this one was a quick fix made after the check.", "uses": "Team Communication Workflow", "good": ["No package leaves the team without a completed check list carrying the checker's name and the date", "A change made after the check re-triggers the check on whatever it touched — including at the end of the day on a deadline", "A copy of exactly what was issued is archived, with version and date; the record is the issued PDF, not the model", "The transmittal states the contents and any known open items", "A comment the check list would not have caught becomes a new line in it"], "fail": ["Minor change at the end could easily causes big changes", "The check list ticked in one pass as a formality", "The same class of comment coming back three rounds running while the check list never changes"], "task": "From this week to the end of the program, no package leaves your team without a signed check list carrying the checker's name and the date. Whenever something is found afterwards that the check list would not have caught, add it as a new line. This runs in the background alongside everything that follows.", "signoff": "Assessed at the end of Phase 1: no unchecked release in the period, and every miss added to the check list.", "weekLabel": "Week 3", "theme": "Does the Check List Actually Work", "phase": 1}, {"id": 6, "title": "Constructability for Electrical", "purpose": "A clash-free model is not the same as an installable one. The model is a set of instructions for a crew with a lift, a bender and a schedule.", "uses": "Project Technical Standards & Preferences Form", "good": ["Access and maintenance — working clearance and dedicated space at panels, switchgear and transformers kept clear of other trades and of your own conduit; pull points reachable; junction boxes not stranded above hard ceilings", "Installation sequence — what goes in before what, which racks precede the duct drops, which runs must be in place before the deck is poured", "Supports — hangers landing on real structure, sensible rod lengths, racks sized for the conduit going on them plus the spares the field will add", "Bends and pulls — bend radius achievable with the bender the field actually uses, pull points placed so cable can be pulled within tension limits, cumulative bend limits respected in the real routing and not just on paper", "Underground — cover depth, duct bank spacing and separation from other utilities, stub-up locations verified against current wall and gear positions, sweeps clear of rebar and footings, all reconciled against the pour date", "Prefab — runs broken at sensible lengths, spools that fit on a truck and through a door, rack assemblies that can be built in the shop", "Delivery and rigging — gear can physically reach its pad: door widths, lift capacity, route in", "Penetrations and sleeves — located, sized, coordinated with structural, and correct for fire-rated assemblies"], "fail": ["A pull box installed where a lift cannot reach it", "Conduit half an inch off a beam flange: clash-free in the model, unbuildable in the field", "Prefabbed equipment or conduit rack is too big to deliver it on the field", "A stub-up landing inside a wall that moved two revisions ago"], "task": "Take a coordinated area and go through it looking for places where there is no clash, but the work would still be difficult or impossible to install — access, support, sequence or simply no room to work. Alongside that, look for what is illogical in the conduit routing, the supports and the fixings. Find at least five, and write up each one with a short note on why it is a problem. From this week, keep a running list of the lessons these findings give you.", "signoff": "At least four of your five findings confirmed as real by your mentor. The lessons list is in use by the team by the end of Phase 1.", "weekLabel": "Week 4", "theme": "Can It Actually Be Built", "phase": 1}, {"id": 7, "title": "Writes Tasks the Team Can Start Without Asking", "purpose": "A task is an instruction an engineer can act on without coming back to you. Anything missing from it becomes an interruption, an assumption, or rework.", "uses": "Team Communication Workflow", "good": ["Scope boundary: building, level, area, system — and what is explicitly not included", "Source: model version, redline PDF and its revision, RFI number, sheet and revision, spec section", "Definition of done, written at the same time as the task — without it, status reporting at the daily is guesswork", "Priority, due date and an hour estimate", "Who to go to when it is blocked"], "fail": ["A task with no area boundary, no redline reference and no definition of done", "No hour estimate, so nobody knows a task was a thirty-hour task until day three", "Pointing at the information source without path link to it", "Assigning work that depends on an unanswered RFI without saying so"], "task": "Write the daily tasks for your team, to the requirements set out in the Team Communication Workflow. This continues for the rest of Phase 1.", "signoff": "Across the whole of Phase 1 the team raises no clarifying questions on your tasks, and your estimate on a task does not exceed the actual by more than 25%.", "weekLabel": "Week 5", "theme": "Running the Team's Work", "phase": 1}, {"id": 8, "title": "Understands Project and Scope Priorities", "purpose": "On an electrical package the sequence is usually dictated by things outside your model — pour dates, gear deliveries, deck schedules, inspections, area releases. A lead who cannot name the driver behind a date cannot prioritize against it.", "good": ["Can name what drives each deadline: a slab or deck pour, a gear delivery, an inspection, a GC area release, another trade waiting on your sign-off", "Separates the critical path from work that is merely valuable", "Sequences around the coordination hierarchy — structure, large duct and pipe, then conduit — and therefore claims space and raises conflicts early instead of absorbing whatever is left", "Re-checks priorities weekly against the current GC and client schedule"], "fail": ["Spreading effort evenly across the model while a pour date for one area is two weeks out", "Finishing an area nobody needs before starting the one the field is waiting on", "Treating clash count as the priority metric instead of which areas are signed off"], "task": "Work from recorded meetings — either recordings from other projects that your mentor gives you, or recordings of meetings you sit in on yourself. Listen to each one and write out what follows from it for the work: the priorities, what drives each date, and what changes for the team. Do this for several meetings.", "signoff": "Your write-up carries every priority and every date your mentor took from the same recording, with nothing missed that moves a deliverable.", "weekLabel": "Week 5", "theme": "Running the Team's Work", "phase": 1, "uses": null}, {"id": 9, "title": "Prevents and Resolves Overtime", "purpose": "Overtime is almost never a work-rate problem. It is a promise made without counting capacity, discovered too late to renegotiate. Both halves of that are the lead's job.", "uses": "Team Communication Workflow", "good": ["Counts before committing: available engineer-hours for the window against estimated hours, with a realistic allowance for revisions and checking", "Asks the capacity question at the daily every day, and tracks plan against actual at the end of each day, so a Friday deadline in trouble is visible on Tuesday", "Knows the four levers and reaches for them early — partial issue, reduced detail, a moved date, or issue on time with a written list of known open items", "Tells the client while there is still a choice to make, not on the due date", "Treats a second consecutive overtime week as a planning failure to escalate, not endurance to admire"], "fail": ["The team works Saturday and nobody outside the team ever finds out, so the estimate that caused it is never corrected", "Adding engineers to a late package in the final week and losing more time to onboarding than is gained", "— Tries to please the client and get the job done today without verifying whether the deadlines are realistic", "— Skipping the check step to hit the date, producing a rejected package and a second overtime week"], "task": "Write the letter that tells the client a deliverable will not make its date and has to move. Take the nearest real deadline on your project and work out a plausible reason it is at risk. The letter states what moves, by how long, why, what is being done about it, and what you need back. It goes to your mentor and the PM for review — it is not sent.", "signoff": "The letter is ready to send as written: the reason is stated without excuses, the new date is concrete, and the PM would put their own name to it.", "weekLabel": "Week 6", "theme": "Load, Escalation and Scope", "phase": 1}, {"id": 10, "title": "Escalates Inside Eracore at the Right Time", "purpose": "Some problems are not yours to solve alone. A lead who absorbs everything looks reliable right up to the point where the project quietly fails.", "uses": "Team Communication Workflow", "good": ["Knows the escalation table in the Team Communication Workflow and can say, for any given problem, whether it is a lead decision, a client RFI or a PM matter", "Escalates with a position, not a panic: the problem, the impact in hours and dates, two options, a recommendation", "Escalates while the decision still exists as a choice", "Keeps escalation and blame separate"], "fail": ["Heroic absorption — silently covering a large scope increase until the team burns out", "Escalating with no options, which just moves the problem up a level", "Escalating after the commitment has already been made"], "task": "Take the electrical design on your project and compare it against the project specification and the client requirements that are already recorded. Where they differ, write the document that raises it — the RFI or the letter — one per discrepancy, stating what the design shows, what the requirement says, and what you propose. Name the row of the escalation table each one falls under. They go to your mentor and the PM for review.", "signoff": "The discrepancies are real, each one is routed correctly against the escalation table, and every document is usable as written.", "weekLabel": "Week 6", "theme": "Load, Escalation and Scope", "phase": 1}, {"id": 11, "title": "Recognizes Scope Changes and Raises Them", "purpose": "This is where most overtime actually starts. A client asks for something small, the team does it, it happens again and again, and the package is well over the hours that were sold with nothing on paper.", "good": ["Knows what was contracted: the areas, the systems, the LOD, the number of coordination rounds, the deliverable list", "Recognizes the creep patterns — extra areas or levels, systems that were never in scope, a jump in required detail, re-coordination caused by another trade's late design change, added revision rounds, and requests for data that were never in the deliverable list", "Flags it the moment it appears, in writing and in neutral terms: this sits outside the current scope, here is the estimated impact, confirming you want us to proceed on that basis", "Hands it to the PM to price rather than negotiating money personally", "Keeps a running change log per project"], "fail": ["It is only a few hours — repeatedly", "Raising it at the end of the project, where it reads as an excuse rather than a notice", "Refusing the work bluntly instead of routing it through the PM"], "task": "Review the last three months on your project and list every request that fell outside the original scope, with an honest hour estimate for each. Total it. Write the change notice that should have gone out for the two largest, and set up a running change log for the project going forward.", "signoff": "The total is reviewed and accepted as realistic by the PM. The change log is live and updated weekly.", "weekLabel": "Week 6", "theme": "Load, Escalation and Scope", "phase": 1, "uses": null}, {"id": 12, "title": "Attends Client Meetings and Reports Your Scope", "purpose": "You have been sitting in these meetings as a listener since Week 1. Now you speak in them. The test is not attendance — it is whether, an hour after the call, you can say exactly what was agreed, who owes what, and what it costs your team.", "good": ["Knows before the call which areas are on the agenda, what state the model is in for those areas, and what is still open from last time", "Speaks for the electrical scope: what is modeled, what is coordinated, what is blocked and by whom", "Records decisions as they are made, including the ones that land on other trades", "Never commits to a date or an added area without checking team capacity first", "Follows up the meeting minutes in writing the same day"], "fail": ["Agreeing to a date live on the call, then discovering the team is already fully loaded", "Leaving with an impression instead of a record", "Reporting activity instead of status"], "task": "For your first three meetings in this phase, issue minutes within two hours in the format Decisions / Actions (who, by when) / Open questions and RFIs / Risks, and compare against your mentor's version of the same call. At the fourth, present one area of your own scope for three to five minutes.", "signoff": "Your minutes match the mentor's on every decision and action item on two consecutive meetings. Your scope report needs no correction from the mentor in front of the client.", "weekLabel": "Weeks 7–10", "theme": "Client and People", "phase": 2, "uses": null}, {"id": 13, "title": "Runs a Meeting and Reports Progress", "purpose": "A coordination call is a working session, not a status update. It is prepared for in advance, kept on the agenda, and ends with decisions that have owners and dates — the same discipline the Team Communication Workflow applies to the daily, with a client in the room.", "uses": "Team Communication Workflow", "good": ["Agenda out the day before, listing the areas covered and the decisions needed", "Views, clash results and markups saved as viewpoints in advance — never navigating the model live looking for the problem", "Progress reported as Plan / Actual / Risk / What we need from you, by area and deliverable", "Every unresolved item leaves with an owner and a date", "Can handle trade-to-trade coordination discussion and arguments at the meeting"], "fail": ["Hunting for the clash while the room watches", "A percentage with no definition of what complete means", "No meeting minutes, so the same argument runs again next week"], "task": "Run one full agenda item of a live client coordination call with your mentor present, then a full call. You are scored on five criteria — preparation, timekeeping, clarity of status, decisions captured, control of the room.", "signoff": "Four out of five or better on two separate client calls, including decisions captured in both.", "weekLabel": "Weeks 7–10", "theme": "Client and People", "phase": 2}, {"id": 14, "title": "Knows What to Raise with the Client and What to Decide Yourself", "purpose": "Ask too much and you look unable to run your own scope; ask too little and you eat rework, or pour concrete around a wrong assumption. You have been practising this in the decision log since Week 3 — now it is assessed live.", "uses": "Project Technical Standards & Preferences Form", "good": ["Decides it when it sits inside the standards form, the BEP and the approved drawings; when it is reversible at low cost; and when there is already a precedent on this project", "Asks when it changes scope, cost or a date; affects another trade's space or sequence; contradicts the contract documents; is a code interpretation or design-intent question; or commits something that gets poured, ordered or fabricated", "Batches questions into a single RFI list on a set rhythm instead of messaging the GC through the day", "Asks with a proposal: context, two options, a recommendation, and what happens without an answer by a given date", "Records the answer where it will still be found in a month — the standards form and the check list, not only the channel thread"], "fail": ["Quietly picking a solution that conflicts with design intent, and finding out after the pour", "Sending an open-ended question with no options attached", "Holding a whole area hostage to one unanswered question instead of working around it and flagging the assumption"], "task": "Review the decision log you have kept since Week 3 with your mentor; the scoring is on misclassifications in both directions. Then rewrite your five most recent questions to the client into the proposal format above, and issue the next RFI batch yourself.", "signoff": "No more than one misclassification across the logged period, and none of the should-have-asked type. All five rewritten questions accepted without further edits.", "weekLabel": "Weeks 7–10", "theme": "Client and People", "phase": 2}, {"id": 15, "title": "Leads People", "purpose": "The half of the role that is not technical. It is last because it takes the longest to show.", "uses": "Team Communication Workflow", "good": ["Runs a short one-to-one with each engineer on a regular cadence, separate from task talk", "Distributes work by development as well as by speed — does not keep every interesting task, and does not park one engineer on the same repetitive scope for months", "Gives feedback close to the event: what happened, what the impact was, what to do differently", "Treats a repeated mistake as a process problem — the point goes into the check list and the pattern into a one-to-one", "Brings a new engineer onto the project deliberately: a named mentor, real checkpoints, and actual review of what they submit", "Notices workload and morale before they become a resignation; credits publicly and corrects privately"], "fail": ["Doing the difficult work personally because it is faster than explaining it", "Feedback saved up for a quarterly review, by which point it is a list of grievances", "A new joiner left to work the project out from the model"], "task": "Run one-to-ones with every engineer on your team through this phase, with a written note of what was discussed and agreed. Produce a one-page development snapshot per person: current strengths, one growth area, the next task that will stretch them. If a new or rotating engineer joins, onboard them yourself and record what your project needed that the standard onboarding does not cover.", "signoff": "Every engineer has had at least three one-to-ones and can state their own growth area unprompted when the mentor asks. Any engineer you onboarded is productive on real tasks by the end of their second week.", "weekLabel": "Weeks 7–10", "theme": "Client and People", "phase": 2}],
  scenarios: [{"id": 1, "title": "A question with no shape", "situation": "Shortly after the daily, a message from one of your engineers lands in your direct chat: “it isn't working, what do I do?” That is all of it — not what he was doing, not what he tried, not where it stopped. You are in the middle of something else.", "questions": ["a) What do you reply, and what do you not do?", "b) A minute later he sends a screenshot of his screen. Does that change your answer?"]}, {"id": 2, "title": "Blocked while the client sleeps", "situation": "In the morning it turns out one of your engineers cannot continue. What the client's redline shows directly contradicts a requirement recorded in the project technical standards form. He is not willing to decide it himself and is waiting on you. The client's working day starts in several hours, and the area he is working on is issued tomorrow.", "questions": ["a) What has to happen in the next thirty minutes?", "b) Where does this question go, and why not down the other two routes?", "c) What does the engineer do for the rest of the day?"]}, {"id": 3, "title": "The daily drifts", "situation": "At the daily, two engineers start working through a technical solution in one of the areas. The discussion is a real one, but it runs long, goes deep into detail, and directly concerns only the two of them. Everyone else waits in silence and the agenda stops moving.", "questions": ["a) What do you do right now?", "b) Does this go to the deep dive? Justify your answer against the trigger list in the workflow.", "c) What do you owe the team within an hour of the meeting ending?"]}, {"id": 4, "title": "A status with no finish line", "situation": "At the daily it is one engineer's turn and he reports: “working on my area, it's going fine, almost done.” Then he stops and waits for you to move on to the next person.", "questions": ["a) Why is that not a status, and what do you ask instead?", "b) Opening the task, you find it has no definition of done written in it. Whose mistake is that, and in which phase did it happen?"]}, {"id": 5, "title": "A quiet overrun", "situation": "Midweek. Looking at the time records, you notice a task you estimated at twelve hours has already taken sixteen, and the work still is not finished. At today's daily that engineer said nothing about it and asked for no help. The package his area belongs to is issued at the end of the week.", "questions": ["a) What failed, and at which two points should this have surfaced earlier?", "b) What do you do today?", "c) When does this go anywhere, and to whom?"]}, {"id": 6, "title": "A fix after the check", "situation": "End of the working day, and the package is ready to go: the check is complete, the check list is signed, the transmittal is written. Minutes before it is sent, an engineer messages to say he spotted a small error on one of the sheets and has already corrected it. It took two minutes, he says, and affects nothing else.", "questions": ["a) What does the workflow require here?", "b) What exactly do you archive, and what happens if the client later claims the sheet is wrong?"]}, {"id": 7, "title": "An answer only two people have", "situation": "On a call with the client you get an answer to an RFI, and it turns out one of the project requirements differs from how the team has been working up to now. Only you and one engineer were on the call. Everyone else carries on with the previous understanding.", "questions": ["a) Where does this information go, and in what order?", "b) Some time later a new person joins the project and does it the old way. What exactly failed?"]}, {"id": 8, "title": "Finished early", "situation": "Midday. One of your engineers closes the task that was planned for him today and asks what to do next. You are preparing for a client meeting at that moment and do not want to switch context.", "questions": ["a) What do you give him?", "b) And if you have nothing ready?", "c) If this keeps happening, what is actually broken?"]}, {"id": 9, "title": "The third time", "situation": "The same engineer has now made the same mistake in a deliverable for the third time. After the first you gave him feedback, he agreed and understood. After the second you reminded him in passing. This is the third.", "questions": ["a) What do you do on the third occasion, and why is more feedback the wrong instrument?", "b) Name two concrete actions."]}, {"id": 10, "title": "A request at the end of the week", "situation": "Friday evening, the team is finishing the working day. An email arrives from the client with a change that affects part of the already coordinated areas, and he asks for it to be closed by the start of next week because the field is waiting on that specific section. Some of your people have already worked over their hours this week.", "questions": ["a) What is your first action, and what do you certainly not do?", "b) What do you need to establish before you answer the client?", "c) Who do you write to, and under which row of the escalation table?", "d) What of this goes into the end-of-day record?"]}],
  final: [
    {t:"Run a client coordination meeting end to end",d:"Agenda out in advance, your scope reported, decisions captured, minutes issued the same day. Mentor present as an observer only."},
    {t:"Release a real deliverable package",d:"Issued under your own check list, with the transmittal, the archived issued copy, and any known open items stated. Zero critical comments returned."},
    {t:"Present your project and your numbers",d:"The lifecycle map and the completed standards form, plus a review with the PM of your decision log, change log and capacity tracking for the last month."}
  ],
  workflow: [
    {n:1,p:"Preparation",w:"Before the daily · Lead",out:"Tasks published, capacity counted",lede:"The meeting is only as good as the hour before it. Both sides arrive with work already done.",rules:{
      "Team":["Review the daily tasks published by the lead in advance — mandatory before the meeting","Open all required files, models and viewpoints beforehand","Prepare a short status: done, in progress, blocked","Collect questions in advance instead of raising them live"],
      "Lead":["Publish the weekly and daily tasks in the thread channel before the meeting","Make sure every task is clear, bounded and prioritised","Know the overall progress of the team before anyone reports it","Prepare to facilitate — not to solve everything personally"],
      "Count the load":["Available engineer-hours today against the hours the tasks actually need","Include checking and revision time, not only modeling time","If the numbers do not meet, decide now what moves — do not publish a day the team cannot deliver"],
      "Meeting setup":["Daily scheduled in Outlook between 09:00 and 10:00, team local time","The lead is on time, or cancels in advance and hands it to the assistant lead"],
      "The first hour":["The hour before the daily runs on tasks agreed at the end of the previous day","If someone has nothing to run on in the morning, that is an end-of-day failure"]}},
    {n:2,p:"Daily meeting",w:"09:00–10:00 · Lead",out:"Priorities agreed, blockers surfaced",lede:"A short, structured sync. Its purpose is alignment and surfacing blockers — not solving them.",rules:{
      "Check-in (1–3 min)":["A short informal start to engage the team; keep it brief"],
      "Priority alignment":["Clear priorities and top focus areas for today?","When is the next formal submission or deadline?","Aligned on what is critical and what is secondary?"],
      "Capacity check":["Can we deliver today's priorities with the people available today?","Anyone whose task will not land today says so here, not on the due date"],
      "Status":["Each person: done, in progress, blockers","Reported against the definition of done in the task — not as a percentage","“Almost done” is not a status"],
      "Questions":["Only critical blockers are discussed","Long topics are parked to the deep dive, with named participants","Whole-team questions go to the Project Information channel as a thread","No internal answer → client meeting agenda as an RFI"],
      "Record it":["Within one hour, the lead posts what was decided and who owes what by when"]}},
    {n:3,p:"Execution",w:"After the daily · Team",out:"Work moves",lede:"The longest part of the day and the one that needs the least management.",rules:{
      "Team":["Work the assigned tasks","Ask questions only when genuinely blocked"],
      "Lead":["Support with blockers","Avoid unnecessary involvement"],
      "Blocker response":["Acknowledge a blocker within 30 minutes, even if the answer takes longer","No immediate answer → name the fallback: a documented assumption, or the next task"],
      "Finishing early":["Take the next item from the ranked priority list","Nothing ready → check another package against the check list","If this happens often, preparation is under-planning — fix it there"]}},
    {n:4,p:"Question workflow",w:"All day · Team → Lead",out:"Answers, or a routed escalation",lede:"A funnel. Every question passes four filters; most never reach the lead, and only a few reach the client.",rules:{
      "1 · Try yourself":["10 to 30 minutes first: drawings, model, previous examples, the standards, search"],
      "2 · Structure it":["What you need · what you tried · what didn't work — then ask once"],
      "3 · Now or later":["Blocker → ask immediately","Not a blocker → add it to the deep-dive list"],
      "4 · Route it":["Three options and no fourth: decide it, client RFI, or the PM","Pick one the same day using the escalation table","An RFI rarely returns the same day — pair it with a fallback"],
      "Lead response":["Explain why, not just what","Show direction and approach; clarify priority","Do not do the work instead of the team"],
      "Write it down":["Where it will still be found in a month: standards form, check list, project notes","A channel thread is not storage","If the answer would have prevented a returned comment, add it to the check list"]}},
    {n:5,p:"Deep dive",w:"Same day, if triggered · Lead",out:"Decisions on queued topics",lede:"The session where queued questions get resolved properly, with the model open.",rules:{
      "Hold it when":["Two or more non-critical questions are queued","A decision affects more than one person or more than one area","A new client answer or standard needs explaining to the whole team","None of the above — cancel it"],
      "Close it properly":["Every topic ends with a decision, an owner and a date — or a note that it goes to the client","Decisions written into the thread the same day, and into the standards or check list where durable"]}},
    {n:6,p:"Execution",w:"After the deep dive · Team",out:"Work moves on the clarified basis",lede:"Continue after the clarifications and keep momentum.",rules:{
      "Team":["Continue work after the clarifications","Apply the decisions from the deep dive","Maintain momentum"]}},
    {n:7,p:"Check before handover",w:"Before release · Lead",out:"Nothing unchecked leaves",lede:"A day of perfect syncs still ends in a rejected package if nobody checked the work before it went out.",rules:{
      "Done means checked":["“Finished” means checked against the check list, not finished modeling","Signed with the checker's name and date","The checker is not the person who modeled it"],
      "The late change":["Any change after the check re-triggers the check on whatever it touched","No exceptions for small fixes or the last hour before a deadline"],
      "Archive what went out":["Keep the exact issued package, with version and date","The model is not the record; the issued PDF is"]}},
    {n:8,p:"End of day",w:"Last 15 minutes · Team → Lead",out:"Written state of the project",lede:"For a team working against a client in another time zone, the end-of-day record is the main thing anyone outside the team sees.",rules:{
      "Team":["Two or three lines in the thread: done, in progress, blocked, at risk for tomorrow"],
      "Lead":["Consolidate into one end-of-day summary","Compare planned against actual hours while the variance is small","Flag anything threatening a date — to the PM today","Make sure tomorrow morning has tasks to run on"]}}
  ],
  escalation: [
    {s:"Inside the standards, reversible, precedent exists",to:"Lead decides",when:"Immediately"},
    {s:"Design intent, code interpretation, contract documents",to:"Client RFI",when:"Next client meeting or RFI batch"},
    {s:"Affects another trade's space or sequence",to:"Client RFI, copy the GC",when:"Same day"},
    {s:"Scope has grown beyond what was sold",to:"Eracore PM",when:"Same day it is noticed"},
    {s:"A date is not achievable with the assigned team",to:"Eracore PM",when:"As soon as it is knowable"},
    {s:"Client unresponsive and work is blocked",to:"Eracore PM",when:"After 48 hours"},
    {s:"Performance or availability puts the package at risk",to:"Eracore PM",when:"Before it affects the date"}
  ],

    {q:"Two engineers are out sick until next week. Counting the remaining hours, Friday's issue cannot be made with who is left.",a:3,row:4},
